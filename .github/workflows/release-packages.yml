name: Prepare release packages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-packages
  cancel-in-progress: false

jobs:
  build:
    name: Build release matrix
    runs-on: macos-15
    timeout-minutes: 180
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      workspace_artifact_id: ${{ steps.workspace.outputs['artifact-id'] }}
      workspace_artifact_name: ${{ steps.metadata.outputs.workspace_artifact_name }}
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up macOS
        uses: ./.github/actions/setup-macos

      - name: Read release metadata
        id: metadata
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "workspace_artifact_name=release-workspace-$version-$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Install cross-build tools
        shell: bash
        run: |
          if ! command -v zig >/dev/null; then
            brew install zig
          fi
          rustup target add \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            aarch64-unknown-linux-gnu \
            x86_64-unknown-linux-gnu

      - name: Check the runner environment
        run: npm run env:check -- --json

      - name: Build every release target
        run: npm run release:build -- --all-targets

      - name: Pack and smoke the ARM macOS packages
        run: npm run release:pack -- --all-targets

      - name: Archive the portable release workspace
        shell: bash
        run: >-
          tar --exclude=dist/release/build --exclude=dist/release/pack-smoke
          -czf "$RUNNER_TEMP/release-workspace.tar.gz" dist/release

      - name: Upload the release workspace
        id: workspace
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.metadata.outputs.workspace_artifact_name }}
          path: ${{ runner.temp }}/release-workspace.tar.gz
          compression-level: 0
          retention-days: 1

  smoke:
    name: Smoke ${{ matrix.target }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            setup: macos
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            setup: macos
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04-arm
            setup: linux
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04
            setup: linux
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Linux
        if: matrix.setup == 'linux'
        uses: ./.github/actions/setup-linux

      - name: Set up macOS
        if: matrix.setup == 'macos'
        uses: ./.github/actions/setup-macos

      - name: Download the release workspace
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.workspace_artifact_name }}
          path: ${{ runner.temp }}/release-workspace

      - name: Restore the release workspace
        shell: bash
        run: tar -xzf "$RUNNER_TEMP/release-workspace/release-workspace.tar.gz"

      - name: Check the runner environment
        run: npm run env:check -- --json

      - name: Smoke the native release
        run: npm run release:smoke

      - name: Repack and smoke the installed launcher
        shell: bash
        run: |
          cp dist/release/packs/packages.json "$RUNNER_TEMP/packages.json"
          npm run release:pack -- --all-targets
          cmp "$RUNNER_TEMP/packages.json" dist/release/packs/packages.json

  packages:
    name: Publish workflow artifact
    needs: [build, smoke]
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download the validated release workspace
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.workspace_artifact_name }}
          path: ${{ runner.temp }}/release-workspace

      - name: Extract the npm packages
        shell: bash
        run: |
          tar -xzf "$RUNNER_TEMP/release-workspace/release-workspace.tar.gz"
          mkdir -p "$RUNNER_TEMP/release-packages"
          cp dist/release/packs/* "$RUNNER_TEMP/release-packages/"

      - name: Upload the validated packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maligator-${{ needs.build.outputs.version }}-packages
          path: ${{ runner.temp }}/release-packages
          compression-level: 0
          retention-days: 7

      - name: Remove the intermediate workspace artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method DELETE
          "repos/$GITHUB_REPOSITORY/actions/artifacts/${{ needs.build.outputs.workspace_artifact_id }}"
