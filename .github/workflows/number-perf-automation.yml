name: Validate Number performance work

on:
  pull_request:
    branches: [things]

permissions:
  contents: write

concurrency:
  group: number-perf-automation
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CC: clang-19
      CXX: clang++-19
    steps:
      - name: Check out automation series
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: automation
          persist-credentials: false

      - name: Check out target branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: things
          path: repo
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - name: Install C23 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19

      - name: Install dependencies
        working-directory: repo
        run: npm ci

      - name: Apply granular Number commits
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          expected=367a98a84bd3751aa27c4d54461adf466268b6dc
          git fetch origin things number-perf-candidate-20260822
          test "$(git rev-parse origin/things)" = "$expected"
          test "$(git rev-parse HEAD)" = "$expected"
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"

          for series in 1 2 3 4 5 6; do
            git am "../automation/.github/number-perf/series-${series}.mbox"
          done

          npm run format
          if ! git diff --quiet; then
            changed="$(git diff --name-only | sort)"
            unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(tests/local/number-methods\.js|tests/native/number-methods\.test\.ts)$' || true)"
            test -z "$unexpected"
            git diff --check
            git add tests/local/number-methods.js tests/native/number-methods.test.ts
            git diff --cached --check
            git commit --no-gpg-sign -m "style(number): format focused tests"
          fi

          python ../automation/.github/number-perf/locale-cache.py
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected_locale=$'runtime/src/builtin_intl.c\nruntime/src/builtin_intl.h\nruntime/src/builtin_number.c'
          test "$changed" = "$expected_locale"
          git add runtime/src/builtin_intl.c runtime/src/builtin_intl.h runtime/src/builtin_number.c
          git diff --cached --check
          git commit --no-gpg-sign -m "perf(number): cache the default locale formatter"

          python ../automation/.github/number-perf/locale-tests.py
          npm run format
          changed="$(git diff --name-only | sort)"
          test "$changed" = "tests/local/number-methods.js"
          git diff --check
          git add tests/local/number-methods.js
          git diff --cached --check
          git commit --no-gpg-sign -m "test(number): cover default locale formatter reuse"

          test -z "$(git status --porcelain)"
          if git diff --name-only "$expected"..HEAD | grep -Eq '^(bench/|scripts/bench|benchmarks/)'; then
            echo "Benchmark files were modified" >&2
            exit 1
          fi

      - name: Validate focused Number behavior
        working-directory: repo
        run: npm run test:native -- tests/native/number-methods.test.ts

      - name: Validate focused Number behavior under GC stress
        working-directory: repo
        env:
          MAL_GC_STRESS: "1"
          MAL_GC_VERIFY: "1"
        run: npm run test:native -- tests/native/number-methods.test.ts

      - name: Run normal repository gate
        working-directory: repo
        run: npm run test:check

      - name: Publish validated candidate
        working-directory: repo
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git push --force-with-lease origin HEAD:number-perf-candidate-20260822
