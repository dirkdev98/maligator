name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - website/**
      - src/**
      - runtime/**
      - scripts/**
      - package.json
      - package-lock.json
      - .npmrc
      - .oxfmtrc.json
      - LICENSE
      - bench/baseline.json
      - tests/wpt/curated.json
      - tests/wpt/expectations.json
      - .github/workflows/website-build.yml
      - .github/actions/setup-linux/action.yml
      - .github/actions/setup-wasi/action.yml
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the prepared container to production (main only).
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: website-deploy
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.changes.outputs.changed || 'true' }}
    steps:
      - name: Require main for production deployments
        if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref != 'refs/heads/main'
        run: |
          echo 'Production website deployments must run from main.' >&2
          exit 1

      - name: Check out website inputs and chart history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.12.0

      - name: Compare website inputs with the live container
        id: changes
        if: github.event_name != 'workflow_dispatch'
        run: node scripts/site-deployment.ts check

  build:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Check out the selected revision and chart history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Linux
        uses: ./.github/actions/setup-linux
        with:
          native-cache: linux-website

      - name: Install the pinned cross compiler
        run: |
          archive="$RUNNER_TEMP/zig.tar.xz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz \
            --output "$archive"
          echo "02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239  $archive" | sha256sum --check
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.15.2" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/zig-x86_64-linux-0.15.2/zig" version

      - name: Install the pinned WASI toolchain
        uses: ./.github/actions/setup-wasi

      - name: Check the runner environment
        run: npm run env:check -- --json

      - name: Build the production website and Explorer
        run: npm run site:container

      - name: Retain native libraries for later runs
        if: always()
        uses: ./.github/actions/save-native-cache

      - name: Check native page responses
        run: |
          mkdir -p .cache/website-build
          PORT=38080 .cache/site-container/current/maligator-site > .cache/website-build/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --connect-timeout 2 --max-time 10 http://127.0.0.1:38080/ --output .cache/website-build/index.html; then break; fi
            kill -0 "$server_pid"
            sleep 1
          done
          node scripts/site-deployment.ts verify http://127.0.0.1:38080

      - name: Record source, generated changes and artifact integrity
        run: |
          git rev-parse HEAD > .cache/website-build/revision.txt
          git diff --binary > .cache/website-build/generated.patch
          sha256sum .cache/site-container/current/maligator-site .cache/explorer-site/current/manifest.json \
            .cache/documentation/container/manifest.json website/index.html website/site-meta.json \
            > .cache/website-build/SHA256SUMS
          tar -czf "$RUNNER_TEMP/website-build.tar.gz" .cache/site-container/current \
            .cache/explorer-site/current .cache/documentation/container .cache/website-build \
            website/index.html website/compatibility.html website/explorer.html website/site-meta.json

      - name: Install the pinned Cloudflare deployment tools
        if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.deploy)
        run: npm ci --prefix website/cloudflare --no-audit --no-fund

      - name: Deploy the Cloudflare container
        if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN secret.' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID secret.' >&2; exit 1; }
          website/cloudflare/node_modules/.bin/wrangler deploy --config website/cloudflare/wrangler.jsonc

      - name: Wait for the container rollout and verify live response bodies
        if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.deploy)
        timeout-minutes: 20
        run: node scripts/site-deployment.ts verify https://maligator.ddv.tools --wait

      - name: Retain the reviewed deployment inputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-build-${{ github.run_id }}
          path: ${{ runner.temp }}/website-build.tar.gz
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 7

      - name: Retain deployment verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/website-build
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
