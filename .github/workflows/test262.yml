name: Test262

# Starting after CI keeps these jobs from queueing the gate behind them.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test262
  cancel-in-progress: false

jobs:
  test262:
    name: Test262 ${{ matrix.shard }}/4
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Linux
        uses: ./.github/actions/setup-linux
        with:
          cache-test262: "true"
          # Restore only: the standards lane prepares the same eval-enabled Test262 runtime.
          native-cache: linux-standards

      - name: Check the runner environment
        run: npm run env:check -- --json

      # Both language variants over a quarter of the corpus, so each shard folds them per
      # test exactly as a full run does and the report job can merge the quarters.
      - name: Run the Test262 shard
        env:
          T262_OBJCACHE: "0"
        run: >-
          MALIGATOR_WORKERS="$(nproc)" node scripts/test262.ts --canonical --backend compiled
          --mode normal --shard ${{ matrix.shard }}/4 --check --policy complete

      - name: Retain the shard report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test262-shard-${{ matrix.shard }}-of-4-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/mal-build/test262/report-*.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  report:
    name: Test262 report
    needs: test262
    if: always() && needs.test262.result != 'skipped' && needs.test262.result != 'cancelled'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      # Commits an improvement-only baseline and maintains the regression issue.
      contents: write
      issues: write
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: ${{ github.event_name == 'workflow_run' }}

      - name: Set up Linux
        uses: ./.github/actions/setup-linux
        with:
          cache-test262: "true"

      - name: Download the shard reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: test262-shard-*-of-4-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/test262-shards

      # Fails unless every shard reported its complete quarter against the same baseline.
      - name: Merge the shard reports
        run: >-
          node scripts/test262-merge.ts .cache/mal-build/test262/report-compiled-normal-combined.json
          $(find .cache/test262-shards -name 'report-compiled-normal-combined-*.json' | sort)

      - name: Summarize the complete report
        id: summary
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          report=.cache/mal-build/test262/report-compiled-normal-combined.json
          node scripts/test262-ci.ts "$report" "$RUNNER_TEMP/test262-issue.md" "$RUN_URL" > "$RUNNER_TEMP/test262-summary.json"
          echo "regressions=$(jq -r .regressions "$RUNNER_TEMP/test262-summary.json")" >> "$GITHUB_OUTPUT"
          echo "improvements=$(jq -r .improvements "$RUNNER_TEMP/test262-summary.json")" >> "$GITHUB_OUTPUT"

      - name: Import an improvement-only baseline
        if: github.event_name == 'workflow_run' && needs.test262.result == 'success' && steps.summary.outputs.regressions == '0' && steps.summary.outputs.improvements != '0'
        run: >-
          npm run test262:update-baseline --
          --from-report .cache/mal-build/test262/report-compiled-normal-combined.json

      # Only onto the tested revision while it is still main; a later run catches up.
      - name: Commit a changed baseline
        if: github.event_name == 'workflow_run' && needs.test262.result == 'success' && steps.summary.outputs.regressions == '0' && steps.summary.outputs.improvements != '0'
        shell: bash
        run: |
          if git diff --quiet -- scripts/test262.json; then
            exit 0
          fi
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main moved past the tested revision; leaving the baseline for a later run."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test262.json
          git commit -m "test262: refresh baseline"
          git push origin HEAD:main

      - name: Update the regression issue
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          REGRESSIONS: ${{ steps.summary.outputs.regressions }}
        shell: bash
        run: |
          title="Automated Test262 regressions"
          issues="$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search '"Automated Test262 regressions" in:title' --limit 10 --json number,state,title --jq '[.[] | select(.title == "Automated Test262 regressions")]')"
          count="$(jq length <<< "$issues")"
          if [ "$count" -gt 1 ]; then
            echo "Expected at most one exact Test262 regression issue, found $count." >&2
            exit 1
          fi
          if [ "$count" -eq 0 ]; then
            if [ "$REGRESSIONS" -gt 0 ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/test262-issue.md"
            fi
            exit 0
          fi
          number="$(jq -r '.[0].number' <<< "$issues")"
          state="$(jq -r '.[0].state' <<< "$issues")"
          gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/test262-issue.md"
          if [ "$REGRESSIONS" -gt 0 ] && [ "$state" = CLOSED ]; then
            gh issue reopen "$number" --repo "$GITHUB_REPOSITORY"
          elif [ "$REGRESSIONS" -eq 0 ] && [ "$state" = OPEN ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Retain the complete report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test262-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/mal-build/test262/report-compiled-normal-combined.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

      - name: Fail on regressions or an incomplete shard
        if: needs.test262.result != 'success'
        run: exit 1
