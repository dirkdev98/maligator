name: Publish npm alpha

run-name: Publish npm alpha ${{ github.event.release.tag_name }}

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-alpha-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.release.prerelease == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        timeout-minutes: 10
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        timeout-minutes: 10
        with:
          node-version: 24.14.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Confirm main-branch ancestry
        timeout-minutes: 10
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install dependencies
        timeout-minutes: 30
        run: npm ci

      - name: Confirm the exact release tag
        timeout-minutes: 10
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: npm run release:verify-tag -- "$RELEASE_TAG"

      - name: Download the prepared release assets
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          --pattern "*.tgz" --pattern "packages.json" --dir dist/release/packs

      - name: Publish through npm trusted publishing
        timeout-minutes: 30
        run: >-
          npm run release:publish -- --confirm
          "$(node -p 'require("./package.json").version')" --trusted-publishing
