name: Publish npm alpha

run-name: Publish npm alpha ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact alpha version committed in package.json
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-alpha-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Check out the release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.14.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Confirm the committed release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: >-
          node -e 'const actual = require("./package.json").version;
          if (actual !== process.env.RELEASE_VERSION) {
          throw new Error(`package.json is ${actual}, not ${process.env.RELEASE_VERSION}`); }'

      - name: Install dependencies
        run: npm ci

      - name: Install the pinned Rust toolchain
        working-directory: runtime/rust
        run: rustup show active-toolchain

      - name: Run the developer release gate
        run: npm run test:check

      - name: Build the Apple Silicon release
        run: npm run release:build

      - name: Smoke-test the release binary
        run: npm run release:smoke

      - name: Pack and verify the npm packages
        run: npm run release:pack

      - name: Publish through npm trusted publishing
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: npm run release:publish -- --confirm "$RELEASE_VERSION" --trusted-publishing
