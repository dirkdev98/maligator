name: Native remainder

on:
  push:
    branches: [main]
  schedule:
    - cron: "43 2 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-remainder
  cancel-in-progress: false

jobs:
  native-remainder:
    name: ${{ startsWith(matrix.os, 'macos') && 'macOS ARM' || 'Linux' }} remaining ${{ matrix.lane }} ${{ matrix.shard }}/${{ matrix.shards }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    permissions:
      contents: read
      # The cache-line save step deletes the snapshot it superseded.
      actions: write
    env:
      # Hosted Linux runners have four CPUs; macOS ARM runners have three.
      REMAINDER_WORKERS: ${{ startsWith(matrix.os, 'macos') && '3' || '4' }}
      # The weekly run stays cold so cache-identity defects still surface.
      NATIVE_CACHE: >-
        ${{ github.event_name != 'schedule' && format('{0}-remaining-{1}-{2}',
        startsWith(matrix.os, 'macos') && 'macos' || 'linux', matrix.lane, matrix.shard) || '' }}
    strategy:
      fail-fast: false
      matrix:
        # Shard counts follow each dimension's recorded duration; macOS keeps the
        # hosted five-runner cap together with the CI smoke job.
        include:
          - { os: ubuntu-26.04, lane: native, shard: 1, shards: 3 }
          - { os: ubuntu-26.04, lane: native, shard: 2, shards: 3 }
          - { os: ubuntu-26.04, lane: native, shard: 3, shards: 3 }
          - { os: ubuntu-26.04, lane: sanitizer, shard: 1, shards: 2 }
          - { os: ubuntu-26.04, lane: sanitizer, shard: 2, shards: 2 }
          - { os: macos-15, lane: native, shard: 1, shards: 2 }
          - { os: macos-15, lane: native, shard: 2, shards: 2 }
          # CI saves the other lanes' shared snapshots; only macOS sanitizers run here alone.
          - { os: macos-15, lane: sanitizer, shard: 1, shards: 2, owner: true }
          - { os: macos-15, lane: sanitizer, shard: 2, shards: 2 }
    steps:
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: exit 1

      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Linux
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux
        with:
          native-cache: ${{ env.NATIVE_CACHE }}

      - name: Set up macOS
        if: runner.os == 'macOS'
        uses: ./.github/actions/setup-macos
        with:
          native-cache: ${{ env.NATIVE_CACHE }}
          native-cache-owner: ${{ matrix.owner == true && 'true' || 'false' }}

      - name: Check the runner environment
        run: npm run env:check -- --json

      # The live postgres.js suites skip without a server; Linux runners can host one.
      # The large-types suite runs in the sanitizer lane.
      - name: Start PostgreSQL for the live suites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run --detach --name maligator-postgres --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_PASSWORD=postgres postgres:17
          for attempt in $(seq 1 30); do
            docker exec maligator-postgres pg_isready --host 127.0.0.1 --username postgres && break
            sleep 2
          done
          docker exec maligator-postgres pg_isready --host 127.0.0.1 --username postgres
          {
            echo "MAL_POSTGRES_LIVE=1"
            echo "MAL_POSTGRES_FEATURES_LIVE=1"
            echo "MAL_POSTGRES_QUERY_LIVE=1"
            echo "MAL_POSTGRES_TYPES_LIVE=1"
          } >> "$GITHUB_ENV"

      - name: Run the remaining native dimension
        run: >-
          npm run test:native:remainder -- --workers "$REMAINDER_WORKERS" --lane ${{ matrix.lane }}
          --shard ${{ matrix.shard }}/${{ matrix.shards }}

      # A Linux shard without /mnt filled 87 GB of free root disk; record where it goes.
      - name: Report disk usage
        if: always()
        shell: bash
        run: |
          df -h / "${TMPDIR:-/tmp}" "$MALIGATOR_CACHE_DIR/" 2>/dev/null || true
          du -sh "$MALIGATOR_CACHE_DIR"/v1/* "$MALIGATOR_CACHE_DIR"/v1/blobs/* 2>/dev/null | sort -h | tail -15 || true
          echo "temporary directories: $(find "${TMPDIR:-/tmp}" -mindepth 1 -maxdepth 1 | wc -l)"
          du -sh "${TMPDIR:-/tmp}"/* 2>/dev/null | sort -h | tail -15 || true

      - name: Retain native libraries for later runs
        if: always()
        uses: ./.github/actions/save-native-cache

      - name: Retain verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-remainder-${{ matrix.os }}-${{ matrix.lane }}-${{ matrix.shard }}-of-${{ matrix.shards }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/mal-build/test-suite/runs/*/report.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
