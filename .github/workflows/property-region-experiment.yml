name: Property region candidate

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  evaluate:
    if: >-
      github.event.label.name == 'evaluate-deferred-region-checks' &&
      github.event.pull_request.number == 66 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: write
    env:
      BASE_SHA: dbb213ad356f42f8eb92b7fabfdde009f1130b6a
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-linux
      - name: Establish native environment
        run: |
          sudo apt-get install --yes llvm-19 lld-19
          mkdir -p "$RUNNER_TEMP/native-bin" .cache/root-candidate
          ln -s "$(command -v llvm-ar-19)" "$RUNNER_TEMP/native-bin/ar"
          ln -s "$(command -v ld.lld-19)" "$RUNNER_TEMP/native-bin/ld.lld"
          echo "$RUNNER_TEMP/native-bin" >> "$GITHUB_PATH"
          npm run env:check -- --json | tee .cache/root-candidate/environment.log
          node ./src/index.ts cache status
      - name: Reuse the frozen parent experiment and add admitted-region controls
        run: |
          git show e91c04f1b83af8899289529eb47c8ce8cd6e991b:.github/workflows/root-publication-experiment.yml > .cache/root-candidate/parent.yml
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {parse} from 'yaml';
          const steps=parse(readFileSync('.cache/root-candidate/parent.yml','utf8')).jobs.evaluate.steps;
          let prepare=steps.find(s=>s.name==='Prepare matched construction and traversal probes').run;
          prepare=prepare.replace("'closure-calls', 'short-lived-records'];", "'closure-calls', 'short-lived-records', 'region-owned-three', 'region-owned-six', 'region-inherited', 'region-getter'];");
          prepare=prepare.replace('const fixture = `bench/runtime-gap/cases/${id}.mjs`;', 'const fixture = id.startsWith("region-") ? `.cache/root-candidate/${id}.mjs` : `bench/runtime-gap/cases/${id}.mjs`;');
          prepare=prepare.replace('let copies=0, sourceBytes=0;', 'let copies=0, sourceBytes=0, admissions=0;');
          prepare=prepare.replace('if (emitted) { copies+=', 'if (emitted) { admissions+=(emitted.source.match(/mal_vm_property_read_region_begin\\(/g)||[]).length; copies+=');
          prepare=prepare.replace('copies,sourceBytes};', 'copies,sourceBytes,admissions}; if (id.startsWith("region-") && admissions===0) throw Error("No admitted region: "+id);');
          writeFileSync('.cache/root-candidate/prepare.sh',prepare);
          writeFileSync('.cache/root-candidate/apply-parent.sh',steps.find(s=>s.name==='Apply the isolated publication candidate').run);
          writeFileSync('.cache/root-candidate/store-tree.sh',steps.find(s=>s.name==='Store tested Git objects without updating a branch').run.replace("'docs/decisions/native-root-publication.md'];", "'docs/decisions/native-root-publication.md','runtime/src/vm_ops.h','tests/fixtures/primordial-inventory/installers.json'];"));
          for(const [id,width] of [['region-owned-three',3],['region-owned-six',6],['region-inherited',3],['region-getter',3]]) {
            const keys=['a','b','c','d','e','f'].slice(0,width);
            const reads=keys.map(key=>`const ${key}=receiver.${key};`).join('\n');
            const sum=keys.map(key=>`${key}.marker`).join('+');
            const own=keys.map((key,index)=>`${key}:{marker:index+${index+1}}`).join(',');
            const construction=id==='region-inherited' ? 'const receiver=Object.create(prototype); receiver.a={marker:index+1}; return receiver;' : id==='region-getter' ? 'const second={marker:index+2}; return {a:{marker:index+1},get b(){return second;},c:{marker:index+3}};' : `return {${own}};`;
            const source=`import {runRuntimeGapCase} from '../../bench/runtime-gap/case-runner.mjs';
          function read(receiver){${reads}\nreturn ${sum};}
          globalThis.regionRead=read;
          function run(scale){
          const prototype={b:{marker:7},c:{marker:11}};
          const rows=Array.from({length:256},(_,index)=>{${construction}});
          let checksum=0;
          for(let index=0;index<100000*scale;index++) checksum=(checksum+globalThis.regionRead(rows[index&255]))%1000000007;
          return {checksum,operations:100000*scale*${width}};
          }
          runRuntimeGapCase('${id}',run);
          `;
            writeFileSync(`.cache/root-candidate/${id}.mjs`,source);
          }
          JS
          bash .cache/root-candidate/prepare.sh | tee .cache/root-candidate/baseline-build.log
      - name: Apply parent publication change and defer inherited-only checks
        run: |
          bash .cache/root-candidate/apply-parent.sh
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          file=Path('runtime/src/vm_ops.h'); source=file.read_text()
          replacements=[
            ('    const MalObject *prototype;\n    bool inherited;\n    bool active;','    const MalObject *object;\n    bool active;'),
            ('        .prototype = object->prototype,\n        .inherited = !mal_object_has_public_overflow(object),','        .object = object,'),
            ('            ic->receiver_type == MAL_HEAP_OBJECT && region->inherited &&\n            region->prototype == ic->proto_object[0]) {','            ic->receiver_type == MAL_HEAP_OBJECT &&\n            region->object->prototype == ic->proto_object[0] &&\n            !mal_object_has_public_overflow(region->object)) {')
          ]
          for old,new in replacements:
            assert source.count(old)==1,old
            source=source.replace(old,new)
          file.write_text(source)
          inventory=Path('tests/fixtures/primordial-inventory/installers.json')
          rows=json.loads(inventory.read_text())
          matches=[row for row in rows if row['file']=='vm_ops.h']; assert len(matches)==1
          matches[0]['sha256']=hashlib.sha256(file.read_bytes()).hexdigest()
          inventory.write_text(json.dumps(rows,indent='\t')+'\n')
          doc=Path('docs/decisions/native-root-publication.md'); text=doc.read_text()
          old="On each visit, the first load admits an ordinary object and captures its shape,\nslots pointer, first prototype, and absence of public overflow. Each site then\nchecks its current cache row against that admission."
          new="On each visit, the first load admits an ordinary object and captures its shape,\nslots pointer, and ordinary-object pointer. Own-slot hits need no prototype or\noverflow inspection. Inherited rows check the current first prototype and\npublic-overflow status lazily; admitted instructions cannot mutate either.\nEach site checks its current cache row against that admission."
          assert text.count(old)==1;doc.write_text(text.replace(old,new))
          PY
          ./node_modules/.bin/oxfmt docs/decisions/native-root-publication.md tests/fixtures/primordial-inventory/installers.json
          git diff --stat
          git diff -- runtime/src/vm_ops.h
      - name: Check combined emitter and admission contracts
        run: |
          npm run type-check
          npm run test:unit -- --run tests/native-entry-stable-roots.test.ts tests/native-property-read-region.test.ts tests/program-image-emission.test.ts tests/primordial-catalog.test.ts
      - name: Native collection and invalidation checks
        run: |
          npm run test:native -- tests/native/static-property-root-mask.test.ts tests/native/native-property-read-regions.test.ts
          npm run test:sanitize -- tests/native/static-property-root-mask.test.ts tests/native/native-property-read-regions.test.ts
      - name: Measure controls and admitted regions
        run: |
          node .cache/root-candidate/micro.mjs candidate | tee .cache/root-candidate/candidate-build.log
          node .cache/root-candidate/micro.mjs measure | tee .cache/root-candidate/micro-summary.log
      - name: Store tested tree without updating a branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: bash .cache/root-candidate/store-tree.sh
      - name: Plan cumulative full JavaScript runtime comparison
        run: >-
          node scripts/bench.ts javascript --compare "$BASE_SHA"
          --runs 5 --max-pairs 7 --budget-seconds 1200 --plan=json
          | tee .cache/root-candidate/javascript-plan.json
      - name: Measure cumulative full JavaScript runtime
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/bench.ts javascript --compare "$BASE_SHA" \
            --runs 5 --max-pairs 7 --budget-seconds 1200 \
            2>&1 | tee .cache/root-candidate/javascript.log
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: deferred-region-checks-${{ github.run_id }}
          path: |
            .cache/root-candidate/*.json
            .cache/root-candidate/*.log
            .cache/root-candidate/*.patch
            .cache/root-candidate/region-*.mjs
            .cache/bench-comparisons/*/*.json
            .cache/bench-comparisons/*/*.log
          include-hidden-files: true
          retention-days: 7
