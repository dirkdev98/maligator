name: Closure development validation

on:
  push:
    branches: [perf/compact-closures-native-calls]
    paths: [.github/closure-development.patch]

permissions: {}

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.apply.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: perf/compact-closures-native-calls
      - name: Apply the submitted change on the isolated development branch
        id: apply
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          patch=.github/closure-development.patch
          message="$(head -n 1 "$patch" | sed 's/^# //')"
          git apply --check "$patch"
          git apply --index "$patch"
          git rm "$patch"
          git config user.name 'Dirk de Visser'
          git config user.email 'github@dirkdevisser.nl'
          git -c commit.gpgsign=false commit -m "$message"
          git push origin HEAD:refs/heads/perf/compact-closures-native-calls
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: apply
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.apply.outputs.revision }}
          persist-credentials: false
      - uses: ./.github/actions/setup-linux
      - run: npm run env:check -- --json
      - run: npm run type-check
      - name: Check capture lowering
        run: npm run test:unit -- --run tests/native-closure-captures.test.ts
      - name: Check closure semantics in both backends and GC stress
        run: npm run test:native -- tests/native/compact-closures.test.ts
      - name: Retain validation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: closure-validation-${{ github.run_id }}
          path: .cache/mal-build/test-suite/*.json
          if-no-files-found: ignore
          retention-days: 7
