name: Closure development workspace

on:
  push:
    branches: [perf/compact-closures-native-calls]
    paths: [.github/workflows/closure-development.yml]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Package source and Node dependencies for offline development
        run: |
          mkdir -p "$RUNNER_TEMP/closure-workspace/source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/closure-workspace/source"
          cp -a node_modules "$RUNNER_TEMP/closure-workspace/source/"
          cp "$(command -v node)" "$RUNNER_TEMP/closure-workspace/node"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/closure-workspace/revision.txt"
          tar -czf "$RUNNER_TEMP/closure-workspace.tar.gz" -C "$RUNNER_TEMP" closure-workspace
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: closure-workspace
          path: ${{ runner.temp }}/closure-workspace.tar.gz
          retention-days: 1
