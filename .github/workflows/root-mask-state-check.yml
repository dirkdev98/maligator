name: Root mask state check

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  evaluate:
    if: >-
      github.event.label.name == 'verify-emitted-mask-state' &&
      github.event.pull_request.number == 65 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: write
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      MAIN_SHA: dbb213ad356f42f8eb92b7fabfdde009f1130b6a
      REGION_SHA: 0d1295d44d9186a37f28025818d54b4f8c7ec58a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-linux
      - name: Establish the native environment
        run: |
          sudo apt-get install --yes llvm-19 lld-19
          mkdir -p "$RUNNER_TEMP/native-bin" .cache/root-candidate
          ln -s "$(command -v llvm-ar-19)" "$RUNNER_TEMP/native-bin/ar"
          ln -s "$(command -v ld.lld-19)" "$RUNNER_TEMP/native-bin/ld.lld"
          echo "$RUNNER_TEMP/native-bin" >> "$GITHUB_PATH"
          npm run env:check -- --json | tee .cache/root-candidate/environment.log
          node ./src/index.ts cache status
      - name: Build the published parent microbenchmarks
        run: |
          git show e91c04f1b83af8899289529eb47c8ce8cd6e991b:.github/workflows/root-publication-experiment.yml > .cache/root-candidate/original.yml
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {parse} from 'yaml';
          const steps=parse(readFileSync('.cache/root-candidate/original.yml','utf8')).jobs.evaluate.steps;
          writeFileSync('.cache/root-candidate/prepare.sh',steps.find(s=>s.name==='Prepare matched construction and traversal probes').run);
          JS
          bash .cache/root-candidate/prepare.sh | tee .cache/root-candidate/baseline-build.log
      - name: Track actual operator-mask emission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          file=Path('src/compiler/target/render-native-c.ts'); source=file.read_text()
          def change(old,new):
              global source
              assert source.count(old)==1,(old[:100],source.count(old))
              source=source.replace(old,new)
          change('\t\temittedInstructions.add(ip);\n\t\tconst emitted = emitInstruction(', '\t\temittedInstructions.add(ip);\n\t\tlet operatorMaskEmitted = false;\n\t\tconst emitted = emitInstruction(')
          change('\t\t\t\toutgoingRootPublication,\n', '\t\t\t\tonIncomingRootPublication:\n\t\t\t\t\toperatorInactiveRootMask === undefined\n\t\t\t\t\t\t? undefined\n\t\t\t\t\t\t: () => { operatorMaskEmitted = true; },\n\t\t\t\toutgoingRootPublication,\n')
          change('\t\t\toperatorInactiveRootMask !== undefined ||\n', '\t\t\toperatorMaskEmitted ||\n')
          change('\treadonly incomingRootPublication?: ReadonlyArray<string>;','\treadonly incomingRootPublication?: ReadonlyArray<string>;\n\treadonly onIncomingRootPublication?: () => void;')
          change('\t\tconst publication = context.incomingRootPublication ?? [];', '\t\tconst publication = context.incomingRootPublication ?? [];\n\t\tif (publication.length > 0) context.onIncomingRootPublication?.();')
          file.write_text(source)
          fixture=Path('tests/local/static-property-root-mask.js'); source=fixture.read_text()
          for name in ['retainThroughNumberCoercion','retainThroughStringCoercion','retainThroughThrowingCoercion']:
              old='function '+name+'(holder, operand) {\n'; assert source.count(old)==1
              source=source.replace(old,old+'\tgc();\n')
          fixture.write_text(source)
          with Path('docs/decisions/native-root-publication.md').open('a') as output:
              output.write('\nMask-state tracking records whether the emitted operator actually used its\npublication callback. A proven pure operator does not forget an unchanged\nmask merely because its generic opcode could have required publication.\n')
          Path('tests/native-root-mask-state.test.ts').write_text('''import { describe, expect, it } from "vitest";
          import { createConservativeNativePlan } from "../src/compiler/target/program-image.ts";
          import { emitCompiledFunction } from "../src/compiler/target/render-native-c.ts";
          import type { BytecodeFunction } from "../src/compiler/target/runtime-image.ts";
          describe("native root-mask state after pure operators", () => {
              it("preserves the known mask when a numeric operator emits no publication", () => {
                  const call = {opcode:"CALL", dst:2, callee:1, thisValue:0, argumentCount:0, arguments:[]} as const;
                  const fn: BytecodeFunction = {nameStringIndex:-1,isGenerator:false,isAsync:false,parameterCount:2,mappedArguments:false,mappedArgumentSlots:[],length:2,registerCount:6,capturedCount:0,strict:true,needsArguments:false,argumentSnapshotCount:0,argumentSnapshotPlan:[],isDerivedConstructor:false,isClassConstructor:false,constructorSlotReserve:0,hasPrototype:false,literalShapeCount:0,instructions:[call,{opcode:"BINARY",dst:3,left:4,right:5,operator:"+"},call,{opcode:"RETURN",value:0}],handlers:[],fileIndex:-1,positions:[]};
                  const native = createConservativeNativePlan([fn]).functions[0]!;
                  const callPoint = {kind:"operation",rootRegisters:[0,1,2],incomingRootRegisters:[0,1],outgoingRootRegisters:[0,1,2]} as const;
                  const output = emitCompiledFunction(fn,{...native,registerRepresentations:["boxed","boxed","boxed","number","number","number"],gc:{safepoints:[{...callPoint,instructionIp:0},{kind:"operation",instructionIp:1,rootRegisters:[0,1],incomingRootRegisters:[0,1],outgoingRootRegisters:[0,1]},{...callPoint,instructionIp:2}]}},0,"",false)!.source;
                  expect(output).not.toContain("mal_vm_binary_op");
                  expect(output.match(/MAL_ROOT_MASK\\(0x0\\)/g)).toHaveLength(1);
                  expect(output).not.toContain("MAL_ROOT_MASK(0x4)");
              });
          });
          ''')
          PY
          ./node_modules/.bin/oxfmt src/compiler/target/render-native-c.ts tests/native-root-mask-state.test.ts tests/local/static-property-root-mask.js docs/decisions/native-root-publication.md
          git add --intent-to-add tests/native-root-mask-state.test.ts
          git diff --stat
      - name: Verify parent candidate
        run: |
          npm run type-check
          npm run test:unit -- --run tests/native-root-mask-state.test.ts tests/native-entry-stable-roots.test.ts tests/native-root-mask-edges.test.ts tests/program-image-emission.test.ts tests/execution-liveness-transfers.test.ts
          node --expose-gc --input-type=module -e 'globalThis.__mal_collect_garbage=globalThis.gc; await import("./tests/local/static-property-root-mask.js");'
          npm run test:native -- tests/native/static-property-root-mask.test.ts
          npm run test:sanitize -- tests/native/static-property-root-mask.test.ts
      - name: Compare parent microbenchmarks
        run: |
          node .cache/root-candidate/micro.mjs candidate | tee .cache/root-candidate/candidate-build.log
          node .cache/root-candidate/micro.mjs measure | tee .cache/root-candidate/micro-summary.log
      - name: Prepare read-only tree publication
        run: |
          cat > .cache/root-candidate/store.mjs <<'JS'
          import {readFileSync,writeFileSync,existsSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          const api=async(endpoint,body)=>{
            const response=await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/git/${endpoint}`,{method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
            if(!response.ok) throw Error(`Git object storage failed: ${response.status}`);
            return response.json();
          };
          const files=git('diff','--name-only',process.env.HEAD_SHA,'--').split('\n').filter(Boolean);
          const tree=[];
          for(const path of files){
            if(!existsSync(path)){tree.push({path,mode:'100644',type:'blob',sha:null});continue;}
            const {sha}=await api('blobs',{content:readFileSync(path,'utf8'),encoding:'utf-8'});
            tree.push({path,mode:'100644',type:'blob',sha});
          }
          const result=await api('trees',{base_tree:git('rev-parse',`${process.env.HEAD_SHA}^{tree}`),tree});
          const record={stage:process.argv[2],parent_sha:process.env.HEAD_SHA,region_sha:process.env.REGION_SHA,tree_sha:result.sha,files:tree};
          writeFileSync(`.cache/root-candidate/${process.argv[2]}-publication.json`,JSON.stringify(record,null,2));
          console.log('TESTED_TREE '+JSON.stringify(record));
          JS
      - name: Store parent candidate without updating a branch
        id: parent
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node .cache/root-candidate/store.mjs parent
          git diff --binary > .cache/root-candidate/parent.patch
          echo "tree=$(node -p 'JSON.parse(require("fs").readFileSync(".cache/root-candidate/parent-publication.json")).tree_sha')" >> "$GITHUB_OUTPUT"
      - name: Retain tested parent evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tested-mask-state-${{ steps.parent.outputs.tree }}
          path: .cache/root-candidate/
          include-hidden-files: true
          retention-days: 7
      - name: Plan parent full JavaScript workload in closed compiled mode
        run: >-
          node scripts/bench.ts javascript --mode closed-compiled --compare "$MAIN_SHA"
          --runs 5 --max-pairs 5 --budget-seconds 900 --plan=json
          | tee .cache/root-candidate/parent-javascript-plan.json
      - name: Measure parent JavaScript runtime
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/bench.ts javascript --mode closed-compiled --compare "$MAIN_SHA" \
            --runs 5 --max-pairs 5 --budget-seconds 900 \
            2>&1 | tee .cache/root-candidate/parent-javascript.log
          find .cache/bench-comparisons -maxdepth 2 -name report.json -exec cat {} \;
      - name: Integrate only the existing region changes
        run: |
          git config user.name 'Maligator verification'
          git config user.email 'verification@users.noreply.github.com'
          git add src/compiler/target/render-native-c.ts tests/native-root-mask-state.test.ts tests/local/static-property-root-mask.js docs/decisions/native-root-publication.md
          git -c commit.gpgsign=false commit -m 'checkpoint: verified emitted mask state'
          git diff --binary 13ad801d89d5667783acdc0b3e280878ff4a7b2a "$REGION_SHA" -- . ':(exclude)docs/decisions/native-root-publication.md' > .cache/root-candidate/region.patch
          git apply --3way .cache/root-candidate/region.patch
          python3 - <<'PY'
          from pathlib import Path
          import os, subprocess
          file=Path('docs/decisions/native-root-publication.md')
          parent=file.read_text()
          region=subprocess.check_output(['git','show',os.environ['REGION_SHA']+':docs/decisions/native-root-publication.md'],text=True)
          marker='## Extending native regions'; assert parent.count(marker)==1
          section=region.split('## Bounded property read regions',1)[1].split(marker,1)[0]
          parent=parent.replace(marker,'## Bounded property read regions'+section+marker)
          old='Storage/prototype admissions must therefore end at an invalidating operation,\nor leave through a generic continuation and obtain a new admission afterward.'
          new='A collecting poll is a hard admission boundary even when collection does not\nmove objects. The bounded property region excludes calls, stores, polls,\nbranches, allocation, and unknown coercions. An allocation-only effect does not\nby itself license retaining borrowed storage. Future extensions must end the\nadmission at an invalidating operation or use a generic continuation; fresh\nadmission belongs to a subsequent region, after the invalidation.'
          assert parent.count(old)==1;file.write_text(parent.replace(old,new))
          PY
          ./node_modules/.bin/oxfmt docs/decisions/native-root-publication.md
          git diff --check
      - name: Verify the restacked region code
        run: |
          npm run type-check
          npm run test:unit -- --run tests/native-property-read-region.test.ts tests/native-root-mask-state.test.ts tests/native-root-mask-edges.test.ts tests/program-image-emission.test.ts tests/primordial-catalog.test.ts
          npm run test:native -- tests/native/native-property-read-regions.test.ts
          npm run test:sanitize -- tests/native/native-property-read-regions.test.ts
      - name: Store verified stack without updating a branch
        id: stack
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node .cache/root-candidate/store.mjs stack
          git diff --binary "$HEAD_SHA" > .cache/root-candidate/stack.patch
          echo "tree=$(node -p 'JSON.parse(require("fs").readFileSync(".cache/root-candidate/stack-publication.json")).tree_sha')" >> "$GITHUB_OUTPUT"
      - name: Retain verified stack
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tested-restacked-regions-${{ steps.stack.outputs.tree }}
          path: |
            .cache/root-candidate/*-publication.json
            .cache/root-candidate/*.patch
            .cache/root-candidate/*.log
          include-hidden-files: true
          retention-days: 7
      - name: Plan cumulative JavaScript runtime comparison
        run: >-
          node scripts/bench.ts javascript --mode closed-compiled --compare "$MAIN_SHA"
          --runs 5 --max-pairs 5 --budget-seconds 900 --plan=json
          | tee .cache/root-candidate/stack-javascript-plan.json
      - name: Measure cumulative JavaScript runtime
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/bench.ts javascript --mode closed-compiled --compare "$MAIN_SHA" \
            --runs 5 --max-pairs 5 --budget-seconds 900 \
            2>&1 | tee .cache/root-candidate/stack-javascript.log
      - name: Retain final reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mask-state-and-stack-${{ github.run_id }}
          path: |
            .cache/root-candidate/*.json
            .cache/root-candidate/*.patch
            .cache/root-candidate/*.log
            .cache/bench-comparisons/*/*.json
            .cache/bench-comparisons/*/*.log
          include-hidden-files: true
          retention-days: 7
