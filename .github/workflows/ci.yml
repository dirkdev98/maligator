name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-lanes:
    name: Linux ${{ matrix.lane }}${{ matrix.shards && format(' {0}/{1}', matrix.shard, matrix.shards) || '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: quality
          - { lane: standards, cache: linux }
          - { lane: native, cache: linux, shard: 1, shards: 2 }
          - { lane: native, cache: linux, shard: 2, shards: 2 }
          - { lane: sanitizer, cache: linux-sanitizer, shard: 1, shards: 3 }
          - { lane: sanitizer, cache: linux-sanitizer, shard: 2, shards: 3 }
          - { lane: sanitizer, cache: linux-sanitizer, shard: 3, shards: 3 }
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Linux
        uses: ./.github/actions/setup-linux
        with:
          cache-test262: ${{ matrix.lane == 'standards' && 'true' || 'false' }}
          native-cache: ${{ matrix.cache }}

      - name: Check the runner environment
        run: npm run env:check -- --json

      - name: Run the selected check lane
        run: >-
          npm run test:check -- --workers 4 --lane ${{ matrix.lane }}
          ${{ matrix.shards && format('--shard {0}/{1}', matrix.shard, matrix.shards) || '' }}

      - name: Retain native libraries for later runs
        if: always()
        uses: ./.github/actions/save-native-cache

      - name: Retain verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.lane }}${{ matrix.shards && format('-{0}-of-{1}', matrix.shard, matrix.shards) || '' }}-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/mal-build/test-suite/runs/*/report.json
            .cache/mal-build/test262*/report-*.json
            .cache/wpt/runs/*/results.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  linux-check:
    name: Linux check
    needs: linux-lanes
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Require every lane to succeed
        env:
          LANE_RESULT: ${{ needs.linux-lanes.result }}
        run: test "$LANE_RESULT" = success

      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Linux
        uses: ./.github/actions/setup-linux

      - name: Download lane reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: linux-*-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/ci-lane-reports

      - name: Verify complete canonical coverage
        run: node scripts/test-suite-ci.ts .cache/ci-lane-reports

      - name: Retain the combined gate report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-check-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/mal-build/test-suite/runs/*/report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  macos-arm-smoke:
    name: macOS ARM smoke
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up macOS
        uses: ./.github/actions/setup-macos
        with:
          cache-test262: "true"
          native-cache: macos

      - name: Check the runner environment
        run: npm run env:check -- --json

      - name: Run smoke tests
        run: npm run test:smoke -- --workers 3

      - name: Retain native libraries for later runs
        if: always()
        uses: ./.github/actions/save-native-cache

      - name: Retain verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-arm-smoke-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/mal-build/test-suite/runs/*/report.json
            .cache/mal-build/test262*/report-*.json
            .cache/wpt/runs/*/results.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
