name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The primordial catalog workflow starts CI for the refresh commits it pushes.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-lanes:
    name: Linux ${{ matrix.lane }}${{ matrix.shards && format(' {0}/{1}', matrix.shard, matrix.shards) || '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
      # The cache-line save step deletes the snapshot it superseded.
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: quality
          # Each job keeps its own cache line beside its lane's shared snapshot, which
          # one job per lane saves; restore picks the newest snapshot of each.
          - { lane: standards, cache: linux-standards }
          - { lane: native, cache: linux-native-1, shard: 1, shards: 2, owner: true }
          - { lane: native, cache: linux-native-2, shard: 2, shards: 2 }
          - {
              lane: sanitizer,
              cache: linux-sanitizer-1,
              shard: 1,
              shards: 3,
              owner: true,
            }
          - { lane: sanitizer, cache: linux-sanitizer-2, shard: 2, shards: 3 }
          - { lane: sanitizer, cache: linux-sanitizer-3, shard: 3, shards: 3 }
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Linux
        uses: ./.github/actions/setup-linux
        with:
          cache-test262: ${{ matrix.lane == 'standards' && 'true' || 'false' }}
          native-cache: ${{ matrix.cache }}
          native-cache-owner: ${{ matrix.owner == true && 'true' || 'false' }}

      - name: Check the runner environment
        run: npm run env:check -- --json

      - name: Run the selected check lane
        run: >-
          npm run test:check -- --workers 4 --lane ${{ matrix.lane }}
          ${{ matrix.shards && format('--shard {0}/{1}', matrix.shard, matrix.shards) || '' }}

      - name: Retain native libraries for later runs
        if: always()
        uses: ./.github/actions/save-native-cache

      - name: Retain verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.lane }}${{ matrix.shards && format('-{0}-of-{1}', matrix.shard, matrix.shards) || '' }}-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/mal-build/test-suite/runs/*/report.json
            .cache/mal-build/test262*/report-*.json
            .cache/wpt/runs/*/results.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  linux-check:
    name: Linux check
    needs: linux-lanes
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Require every lane to succeed
        env:
          LANE_RESULT: ${{ needs.linux-lanes.result }}
        run: test "$LANE_RESULT" = success

      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Linux
        uses: ./.github/actions/setup-linux

      - name: Download lane reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-*-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/ci-lane-reports

      - name: Verify complete canonical coverage
        run: node scripts/test-suite-ci.ts .cache/ci-lane-reports

      - name: Retain the combined gate report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-check-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/mal-build/test-suite/runs/*/report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  macos-arm-smoke:
    name: macOS ARM smoke
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CLANG_CRASH_DIAGNOSTICS_DIR: ${{ github.workspace }}/.cache/clang-crash
    permissions:
      contents: read
      # The cache-line save step deletes the snapshot it superseded.
      actions: write
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up macOS
        uses: ./.github/actions/setup-macos
        with:
          cache-test262: "true"
          native-cache: macos-smoke
          native-cache-owner: "true"

      - name: Check the runner environment
        run: npm run env:check -- --json

      - name: Run smoke tests
        run: |
          mkdir -p "$CLANG_CRASH_DIAGNOSTICS_DIR"
          npm run test:smoke -- --workers 3

      - name: Verify isolate ownership across Worker joins
        run: npm run test:native -- tests/native/isolate-roots.test.ts --maxWorkers=1

      - name: Retain native libraries for later runs
        if: always()
        uses: ./.github/actions/save-native-cache

      - name: Retain verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-arm-smoke-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/mal-build/test-suite/runs/*/report.json
            .cache/mal-build/test262*/report-*.json
            .cache/wpt/runs/*/results.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

      - name: Retain Clang crash diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-clang-crash-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/clang-crash/
            ~/Library/Logs/DiagnosticReports/clang*.crash
            ~/Library/Logs/DiagnosticReports/clang*.ips
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
