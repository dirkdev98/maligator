name: Native performance

on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

jobs:
  javascript:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'native-performance')
    name: Paired JavaScript runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Linux
        uses: ./.github/actions/setup-linux

      - name: Select matching LLVM archive and link tools
        run: |
          sudo apt-get install --yes llvm-19 lld-19
          mkdir -p "$RUNNER_TEMP/native-performance-bin"
          ln -s "$(command -v llvm-ar-19)" "$RUNNER_TEMP/native-performance-bin/ar"
          ln -s "$(command -v ld.lld-19)" "$RUNNER_TEMP/native-performance-bin/ld.lld"
          echo "$RUNNER_TEMP/native-performance-bin" >> "$GITHUB_PATH"

      - name: Check the runner environment
        run: |
          mkdir -p .cache/native-performance
          npm run env:check -- --json | tee .cache/native-performance/environment.log
          node ./src/index.ts cache status
          printf 'base=%s\nhead=%s\n' "$BASE_SHA" "$HEAD_SHA" | tee .cache/native-performance/refs.txt

      - name: Inspect the complete comparison plan
        run: >-
          node scripts/bench.ts javascript --compare "$BASE_SHA"
          --runs 5 --max-pairs 7 --budget-seconds 2700 --plan=json
          | tee .cache/native-performance/plan.json

      - name: Compare JavaScript runtime and individual phases
        run: |
          set -o pipefail
          node scripts/bench.ts javascript --compare "$BASE_SHA" \
            --runs 5 --max-pairs 7 --budget-seconds 2700 \
            2>&1 | tee .cache/native-performance/comparison.log

      - name: Show failed snapshot diagnostics
        if: failure()
        run: find .cache/bench-comparisons -maxdepth 2 -name '*.log' -exec tail -100 {} \;

      - name: Retain comparison evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-performance-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/native-performance/
            .cache/bench-comparisons/*/*.json
            .cache/bench-comparisons/*/*.log
            .cache/bench-comparisons/*/*.md
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  evidence:
    if: >-
      github.event.label.name == 'native-performance-report' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Review retained performance evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Read bounded JSON reports from this branch's retained artifacts
        run: |
          python3 - <<'PY'
          import io, json, os, urllib.error, urllib.request, zipfile
          base = 'https://api.github.com/repos/' + os.environ['REPOSITORY']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          def api(endpoint):
              with urllib.request.urlopen(urllib.request.Request(base + endpoint, headers=headers), timeout=30) as response:
                  return json.load(response)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, response, code, message, response_headers, url):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          artifacts = api('/actions/artifacts?per_page=100')['artifacts']
          selected = [artifact for artifact in artifacts if not artifact['expired'] and artifact.get('workflow_run', {}).get('head_branch') == os.environ['BRANCH'] and artifact['size_in_bytes'] < 20 * 1024 * 1024][:8]
          for artifact in selected:
              try:
                  response = opener.open(urllib.request.Request(base + '/actions/artifacts/' + str(artifact['id']) + '/zip', headers=headers), timeout=30)
              except urllib.error.HTTPError as error:
                  if error.code != 302:
                      raise
                  location = error.headers['Location']
                  if not location.startswith('https://'):
                      raise ValueError('Artifact redirect must use HTTPS')
                  response = urllib.request.urlopen(location, timeout=30)
              with response:
                  data = response.read(20 * 1024 * 1024 + 1)
              if len(data) > 20 * 1024 * 1024:
                  raise ValueError('Artifact exceeds report limit')
              archive = zipfile.ZipFile(io.BytesIO(data))
              print('ARTIFACT ' + json.dumps({key: artifact[key] for key in ['id', 'name', 'workflow_run']}))
              for item in archive.infolist():
                  name = item.filename.rsplit('/', 1)[-1]
                  if item.file_size > 8 * 1024 * 1024 or not name.endswith('.json'):
                      continue
                  if name not in ['micro-report.json', 'report.json', 'publication.json'] and not name.startswith(('pair-', 'warm-')):
                      continue
                  value = json.loads(archive.read(item))
                  if name == 'micro-report.json':
                      for row in value:
                          result = {key: row.get(key) for key in ['id', 'medianReductionPercent', 'madPercentagePoints', 'fasterPairs']}
                          for variant in ['baseline', 'candidate']:
                              result[variant] = {key: row.get(variant, {}).get(key) for key in ['bytes', 'sha256', 'copies', 'sourceBytes']}
                          result['samples'] = row.get('samples')
                          print('MICRO ' + json.dumps(result))
                  elif name == 'report.json':
                      print('COMPARISON ' + json.dumps(value))
                  elif name == 'publication.json':
                      print('PUBLICATION ' + json.dumps(value))
                  elif isinstance(value, dict) and 'javascript' in value:
                      js = value['javascript']
                      print('JAVASCRIPT ' + json.dumps({'snapshot': name, 'source': value.get('source'), 'workload': js.get('workload'), 'phaseChecksums': js.get('phaseChecksums'), 'node': js.get('node'), 'modes': js.get('modes')}))
          PY
