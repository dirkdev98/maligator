name: Native performance

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Exact baseline commit
        required: true
        type: string
      candidate:
        description: Exact candidate commit
        required: true
        type: string
      suite:
        description: Comparison suite
        required: true
        type: choice
        options: [javascript, compiler, micro, all]
        default: javascript
      memory_policy:
        description: Compare a 64 MiB nursery cap and trace compiler ownership separately
        required: false
        type: boolean
        default: false
      compiler_program:
        description: Frozen code-generation isolation or each compiler revision with full host comparisons
        required: false
        type: choice
        options: [frozen, revision]
        default: frozen
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  javascript:
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.suite == 'javascript' || inputs.suite == 'all')) ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'native-performance') &&
      (github.event.action == 'synchronize' || github.event.label.name == 'native-performance'))
    name: ${{ matrix.lane }} ${{ matrix.mode }} / ${{ matrix.comparison }}
    runs-on: ubuntu-26.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        lane: [javascript, javascript-v2]
        mode: [closed-compiled, open-compiled]
        comparison: [parent, cumulative]
    env:
      BASE_SHA: ${{ inputs.baseline || github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ inputs.candidate || github.event.pull_request.head.sha }}
      COMPARISON: ${{ matrix.comparison }}
      MANUAL_COMPARISON: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate || github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve matched baseline
        id: baseline
        run: |
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Comparisons require full commit SHAs.' >&2
            exit 1
          fi
          git rev-parse --verify "$HEAD_SHA^{commit}"
          git rev-parse --verify "$BASE_SHA^{commit}"
          parent="$(git merge-base "$HEAD_SHA" "$BASE_SHA")"
          baseline="$parent"
          if [ "$MANUAL_COMPARISON" = true ]; then
            baseline="$(git rev-parse "$BASE_SHA^{commit}")"
            parent="$baseline"
          elif [ "$COMPARISON" = cumulative ]; then
            baseline="$(git merge-base "$HEAD_SHA" origin/main)"
          fi
          echo "sha=$baseline" >> "$GITHUB_OUTPUT"
          if [ "$COMPARISON" = cumulative ] && [ "$baseline" = "$parent" ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo 'Cumulative baseline equals parent; the parent job covers this comparison.'
          fi

      - name: Set up Linux
        if: steps.baseline.outputs.skip != 'true'
        uses: ./.github/actions/setup-linux

      - name: Select matching LLVM archive and link tools
        if: steps.baseline.outputs.skip != 'true'
        run: |
          sudo apt-get install --yes llvm-21 lld-21
          mkdir -p "$RUNNER_TEMP/native-performance-bin"
          ln -s "$(command -v llvm-ar-21)" "$RUNNER_TEMP/native-performance-bin/ar"
          ln -s "$(command -v ld.lld-21)" "$RUNNER_TEMP/native-performance-bin/ld.lld"
          echo "$RUNNER_TEMP/native-performance-bin" >> "$GITHUB_PATH"

      - name: Check the runner environment
        if: steps.baseline.outputs.skip != 'true'
        env:
          COMPARISON_BASE: ${{ steps.baseline.outputs.sha }}
        run: |
          mkdir -p .cache/native-performance
          npm run env:check -- --json | tee .cache/native-performance/environment.log
          node ./src/index.ts cache status
          printf 'pr_base=%s\nbaseline=%s\nhead=%s\n' "$BASE_SHA" "$COMPARISON_BASE" "$HEAD_SHA" | tee .cache/native-performance/refs.txt

      - name: Inspect the complete comparison plan
        if: steps.baseline.outputs.skip != 'true'
        env:
          COMPARISON_BASE: ${{ steps.baseline.outputs.sha }}
          JAVASCRIPT_MODE: ${{ matrix.mode }}
          JAVASCRIPT_LANE: ${{ matrix.lane }}
        run: |
          node scripts/bench.ts "$JAVASCRIPT_LANE" --mode "$JAVASCRIPT_MODE" --compare "$COMPARISON_BASE" \
            --runs 5 --max-pairs 7 --budget-seconds 2700 --plan=json \
            | tee .cache/native-performance/plan.json

      - name: Compare JavaScript runtime and individual phases
        if: steps.baseline.outputs.skip != 'true'
        env:
          COMPARISON_BASE: ${{ steps.baseline.outputs.sha }}
          JAVASCRIPT_MODE: ${{ matrix.mode }}
          JAVASCRIPT_LANE: ${{ matrix.lane }}
        run: |
          set -o pipefail
          node scripts/bench.ts "$JAVASCRIPT_LANE" --mode "$JAVASCRIPT_MODE" --compare "$COMPARISON_BASE" \
            --runs 5 --max-pairs 7 --budget-seconds 2700 \
            2>&1 | tee .cache/native-performance/comparison.log

      - name: Retain comparison evidence
        if: always() && steps.baseline.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-${{ matrix.lane }}-${{ github.event.pull_request.number || 'main' }}-${{ matrix.mode }}-${{ matrix.comparison }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/native-performance/
            .cache/bench-comparisons/*/*.json
            .cache/bench-comparisons/*/*.log
            .cache/bench-comparisons/*/*.md
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  micro:
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.suite == 'micro' || inputs.suite == 'all')) ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'native-micro-performance') &&
      (github.event.action == 'synchronize' || github.event.label.name == 'native-micro-performance'))
    name: Native micro / ${{ matrix.comparison }}
    runs-on: ubuntu-26.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        comparison: [parent, cumulative]
    env:
      BASE_SHA: ${{ inputs.baseline || github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ inputs.candidate || github.event.pull_request.head.sha }}
      COMPARISON: ${{ matrix.comparison }}
      MANUAL_COMPARISON: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate || github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve matched baseline
        id: baseline
        run: |
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Comparisons require full commit SHAs.' >&2
            exit 1
          fi
          git rev-parse --verify "$HEAD_SHA^{commit}"
          git rev-parse --verify "$BASE_SHA^{commit}"
          parent="$(git merge-base "$HEAD_SHA" "$BASE_SHA")"
          baseline="$parent"
          if [ "$MANUAL_COMPARISON" = true ]; then
            baseline="$(git rev-parse "$BASE_SHA^{commit}")"
            parent="$baseline"
          elif [ "$COMPARISON" = cumulative ]; then
            baseline="$(git merge-base "$HEAD_SHA" origin/main)"
          fi
          echo "sha=$baseline" >> "$GITHUB_OUTPUT"
          if [ "$COMPARISON" = cumulative ] && [ "$baseline" = "$parent" ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo 'Cumulative baseline equals parent; the parent job covers this comparison.'
          fi

      - name: Set up Linux
        if: steps.baseline.outputs.skip != 'true'
        uses: ./.github/actions/setup-linux

      - name: Select matching LLVM archive and link tools
        if: steps.baseline.outputs.skip != 'true'
        run: |
          sudo apt-get install --yes llvm-21 lld-21 linux-tools-generic
          for candidate in /usr/lib/linux-tools/*/perf; do
            if [ -x "$candidate" ]; then
              echo "NATIVE_MICRO_PERF=$candidate" >> "$GITHUB_ENV"
              break
            fi
          done
          mkdir -p "$RUNNER_TEMP/native-performance-bin"
          ln -s "$(command -v llvm-ar-21)" "$RUNNER_TEMP/native-performance-bin/ar"
          ln -s "$(command -v ld.lld-21)" "$RUNNER_TEMP/native-performance-bin/ld.lld"
          echo "$RUNNER_TEMP/native-performance-bin" >> "$GITHUB_PATH"

      - name: Check environment and inspect the micro plan
        if: steps.baseline.outputs.skip != 'true'
        env:
          COMPARISON_BASE: ${{ steps.baseline.outputs.sha }}
        run: |
          mkdir -p .cache/native-performance
          npm run env:check -- --json | tee .cache/native-performance/environment.log
          node ./src/index.ts cache status
          node scripts/native-micro-compare.ts --base "$COMPARISON_BASE" \
            --pairs 7 --target-node-ms 80 --budget-seconds 2400 \
            --diagnostics --perf-pairs 3 \
            --output .cache/native-performance/micro --plan=json \
            | tee .cache/native-performance/plan.json

      - name: Compare frozen micro workloads
        if: steps.baseline.outputs.skip != 'true'
        env:
          COMPARISON_BASE: ${{ steps.baseline.outputs.sha }}
        run: |
          set -o pipefail
          node scripts/native-micro-compare.ts --base "$COMPARISON_BASE" \
            --pairs 7 --target-node-ms 80 --budget-seconds 2400 \
            --diagnostics --perf-pairs 3 \
            --output .cache/native-performance/micro \
            2>&1 | tee .cache/native-performance/comparison.log

      - name: Package bounded per-case production executables and symbol companions
        if: always() && steps.baseline.outputs.skip != 'true'
        run: |
          mkdir -p .cache/native-performance/binary-bundles
          for directory in .cache/native-performance/micro/builds/*; do
            [ -d "$directory" ] || continue
            files=()
            for variant in baseline candidate; do
              for name in production.elf symbols.elf; do
                relative="$variant/diagnostics/$name"
                if [ -f "$directory/$relative" ]; then
                  files+=("$relative")
                fi
              done
            done
            [ "${#files[@]}" -gt 0 ] || continue
            bundle=".cache/native-performance/binary-bundles/$(basename "$directory").tar.gz"
            tar -czf "$bundle" -C "$directory" "${files[@]}"
            bytes="$(stat -c %s "$bundle")"
            printf '%s %s bytes\n' "$bundle" "$bytes" >> .cache/native-performance/binary-bundles.log
            if [ "$bytes" -gt 32505856 ]; then
              echo "Per-case executable bundle exceeds 31 MiB: $bundle ($bytes bytes)" >&2
              mv "$bundle" "$bundle.oversized"
              exit 2
            fi
          done

      - name: Retain micro evidence
        if: always() && steps.baseline.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-micro-${{ github.event.pull_request.number || 'main' }}-${{ matrix.comparison }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/native-performance/**/*.json
            .cache/native-performance/**/*.log
            .cache/native-performance/**/*.mjs
            .cache/native-performance/**/*.c
            .cache/native-performance/**/*.h
            .cache/native-performance/**/*.asm
            .cache/native-performance/**/*.csv
            .cache/native-performance/**/*.patch
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Retain stable-shape-properties executable bundle
        if: always() && steps.baseline.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-micro-elf-${{ github.event.pull_request.number || 'main' }}-${{ matrix.comparison }}-stable-shape-properties-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/native-performance/binary-bundles/stable-shape-properties.tar.gz
          include-hidden-files: true
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

      - name: Retain record-array-traversal executable bundle
        if: always() && steps.baseline.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-micro-elf-${{ github.event.pull_request.number || 'main' }}-${{ matrix.comparison }}-record-array-traversal-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/native-performance/binary-bundles/record-array-traversal.tar.gz
          include-hidden-files: true
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

      - name: Retain direct-calls executable bundle
        if: always() && steps.baseline.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-micro-elf-${{ github.event.pull_request.number || 'main' }}-${{ matrix.comparison }}-direct-calls-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/native-performance/binary-bundles/direct-calls.tar.gz
          include-hidden-files: true
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

      - name: Retain indirect-calls executable bundle
        if: always() && steps.baseline.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-micro-elf-${{ github.event.pull_request.number || 'main' }}-${{ matrix.comparison }}-indirect-calls-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/native-performance/binary-bundles/indirect-calls.tar.gz
          include-hidden-files: true
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

      - name: Retain closure-calls executable bundle
        if: always() && steps.baseline.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-micro-elf-${{ github.event.pull_request.number || 'main' }}-${{ matrix.comparison }}-closure-calls-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/native-performance/binary-bundles/closure-calls.tar.gz
          include-hidden-files: true
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

      - name: Retain short-lived-records executable bundle
        if: always() && steps.baseline.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-micro-elf-${{ github.event.pull_request.number || 'main' }}-${{ matrix.comparison }}-short-lived-records-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/native-performance/binary-bundles/short-lived-records.tar.gz
          include-hidden-files: true
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

      - name: Retain heap-valued-projection executable bundle
        if: always() && steps.baseline.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-micro-elf-${{ github.event.pull_request.number || 'main' }}-${{ matrix.comparison }}-heap-valued-projection-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/native-performance/binary-bundles/heap-valued-projection.tar.gz
          include-hidden-files: true
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

      - name: Retain chained-static-properties executable bundle
        if: always() && steps.baseline.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-micro-elf-${{ github.event.pull_request.number || 'main' }}-${{ matrix.comparison }}-chained-static-properties-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/native-performance/binary-bundles/chained-static-properties.tar.gz
          include-hidden-files: true
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

      - name: Retain infrequent-getter-properties executable bundle
        if: always() && steps.baseline.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-micro-elf-${{ github.event.pull_request.number || 'main' }}-${{ matrix.comparison }}-infrequent-getter-properties-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/native-performance/binary-bundles/infrequent-getter-properties.tar.gz
          include-hidden-files: true
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

      - name: Retain native-property-owned-3 executable bundle
        if: always() && steps.baseline.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-micro-elf-${{ github.event.pull_request.number || 'main' }}-${{ matrix.comparison }}-native-property-owned-3-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/native-performance/binary-bundles/native-property-owned-3.tar.gz
          include-hidden-files: true
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

      - name: Retain native-property-owned-6 executable bundle
        if: always() && steps.baseline.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-micro-elf-${{ github.event.pull_request.number || 'main' }}-${{ matrix.comparison }}-native-property-owned-6-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/native-performance/binary-bundles/native-property-owned-6.tar.gz
          include-hidden-files: true
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

      - name: Retain native-property-mixed-prototypes executable bundle
        if: always() && steps.baseline.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-micro-elf-${{ github.event.pull_request.number || 'main' }}-${{ matrix.comparison }}-native-property-mixed-prototypes-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/native-performance/binary-bundles/native-property-mixed-prototypes.tar.gz
          include-hidden-files: true
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

      - name: Retain native-property-middle-getter executable bundle
        if: always() && steps.baseline.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-micro-elf-${{ github.event.pull_request.number || 'main' }}-${{ matrix.comparison }}-native-property-middle-getter-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/native-performance/binary-bundles/native-property-middle-getter.tar.gz
          include-hidden-files: true
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

  compiler:
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.suite == 'compiler' || inputs.suite == 'all')) ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'native-compiler-performance') &&
      (github.event.action == 'synchronize' || github.event.label.name == 'native-compiler-performance'))
    name: Compiler execution (${{ inputs.compiler_program || 'frozen' }}) / ${{ matrix.comparison }}
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ inputs.memory_policy && 270 || inputs.compiler_program == 'revision' && 260 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        comparison: [parent, cumulative]
    env:
      BASE_SHA: ${{ inputs.baseline || github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ inputs.candidate || github.event.pull_request.head.sha }}
      COMPARISON: ${{ matrix.comparison }}
      MANUAL_COMPARISON: ${{ github.event_name == 'workflow_dispatch' }}
      CAPTURE_BUDGET_SECONDS: "1800"
      COMPILER_PROGRAM: ${{ inputs.compiler_program || 'frozen' }}
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate || github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve matched baseline
        id: baseline
        run: |
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Comparisons require full commit SHAs.' >&2
            exit 1
          fi
          git rev-parse --verify "$HEAD_SHA^{commit}"
          git rev-parse --verify "$BASE_SHA^{commit}"
          parent="$(git merge-base "$HEAD_SHA" "$BASE_SHA")"
          baseline="$parent"
          if [ "$MANUAL_COMPARISON" = true ]; then
            baseline="$(git rev-parse "$BASE_SHA^{commit}")"
            parent="$baseline"
          elif [ "$COMPARISON" = cumulative ]; then
            baseline="$(git merge-base "$HEAD_SHA" origin/main)"
          fi
          echo "sha=$baseline" >> "$GITHUB_OUTPUT"
          if [ "$COMPARISON" = cumulative ] && [ "$baseline" = "$parent" ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo 'Cumulative baseline equals parent; the parent job covers this comparison.'
          fi

      - name: Set up Linux
        if: steps.baseline.outputs.skip != 'true'
        uses: ./.github/actions/setup-linux

      - name: Select matching LLVM archive and link tools
        if: steps.baseline.outputs.skip != 'true'
        run: |
          sudo apt-get install --yes llvm-21 lld-21
          mkdir -p "$RUNNER_TEMP/native-performance-bin"
          ln -s "$(command -v llvm-ar-21)" "$RUNNER_TEMP/native-performance-bin/ar"
          ln -s "$(command -v ld.lld-21)" "$RUNNER_TEMP/native-performance-bin/ld.lld"
          echo "$RUNNER_TEMP/native-performance-bin" >> "$GITHUB_PATH"

      - name: Set up matched Bun controls
        if: steps.baseline.outputs.skip != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Check environment and prepare compiler inputs
        if: steps.baseline.outputs.skip != 'true'
        env:
          COMPARISON_BASE: ${{ steps.baseline.outputs.sha }}
        run: |
          mkdir -p .cache/native-performance
          npm run env:check -- --json | tee .cache/native-performance/environment.log
          node ./src/index.ts cache status
          printf 'pr_base=%s\nbaseline=%s\nhead=%s\n' "$BASE_SHA" "$COMPARISON_BASE" "$HEAD_SHA" | tee .cache/native-performance/refs.txt
          if [ "$COMPILER_PROGRAM" = frozen ]; then
            node scripts/self-compile-experiment.ts capture .cache/native-performance/program \
              --source-only --budget-seconds 120 --plan=json \
              | tee .cache/native-performance/program-plan.json
            node scripts/self-compile-experiment.ts capture .cache/native-performance/program \
              --source-only --budget-seconds 120
          fi

      - name: Export an identified baseline without changing source
        if: steps.baseline.outputs.skip != 'true'
        env:
          COMPARISON_BASE: ${{ steps.baseline.outputs.sha }}
        run: |
          baseline="$PWD/.cache/native-performance/baseline-source"
          objects="$(git rev-parse --path-format=absolute --git-path objects)"
          mkdir -p "$baseline"
          git archive "$COMPARISON_BASE" | tar -x -C "$baseline"
          cmp package-lock.json "$baseline/package-lock.json"
          git init --quiet --initial-branch=benchmark "$baseline"
          printf '%s\n' "$objects" > "$baseline/.git/objects/info/alternates"
          git -C "$baseline" update-ref HEAD "$COMPARISON_BASE"
          git -C "$baseline" read-tree "$COMPARISON_BASE"
          ln -s "$PWD/node_modules" "$baseline/node_modules"
          test -z "$(git -C "$baseline" status --porcelain)"
          git -C "$baseline" rev-parse HEAD | tee .cache/native-performance/archive-commit.txt

      - name: Capture each producer revision for Node controls
        id: node-captures
        if: steps.baseline.outputs.skip != 'true' && !inputs.memory_policy
        run: |
          task="$PWD/.cache/native-performance"
          script="$PWD/scripts/self-compile-experiment.ts"
          (
            cd "$task/baseline-source"
            node "$script" capture "$task/baseline-node" --source-only --budget-seconds 120 --plan=json \
              | tee "$task/baseline-node-plan.json"
            node "$script" capture "$task/baseline-node" --source-only --budget-seconds 120
          )
          node "$script" capture "$task/candidate-node" --source-only --budget-seconds 120 --plan=json \
            | tee "$task/candidate-node-plan.json"
          node "$script" capture "$task/candidate-node" --source-only --budget-seconds 120

      - name: Capture the baseline native compiler
        id: baseline-native
        if: steps.baseline.outputs.skip != 'true'
        run: |
          task="$PWD/.cache/native-performance"
          script="$PWD/scripts/self-compile-experiment.ts"
          program_args=()
          if [ "$COMPILER_PROGRAM" = frozen ]; then program_args=(--program "$task/program"); fi
          cd "$task/baseline-source"
          node "$script" capture "$task/baseline" "${program_args[@]}" \
            --budget-seconds "$CAPTURE_BUDGET_SECONDS" --plan=json | tee "$task/baseline-plan.json"
          node "$script" capture "$task/baseline" "${program_args[@]}" --budget-seconds "$CAPTURE_BUDGET_SECONDS"

      - name: Capture the candidate native compiler
        id: candidate-native
        if: steps.baseline.outputs.skip != 'true'
        run: |
          program_args=()
          if [ "$COMPILER_PROGRAM" = frozen ]; then
            program_args=(--program "$PWD/.cache/native-performance/program")
          fi
          node scripts/self-compile-experiment.ts capture .cache/native-performance/candidate \
            "${program_args[@]}" --budget-seconds "$CAPTURE_BUDGET_SECONDS" --plan=json \
            | tee .cache/native-performance/candidate-plan.json
          node scripts/self-compile-experiment.ts capture .cache/native-performance/candidate \
            "${program_args[@]}" --budget-seconds "$CAPTURE_BUDGET_SECONDS"

      - name: Record compiler build and section sizes
        if: steps.baseline.outputs.skip != 'true'
        run: |
          node --input-type=module <<'JS'
          import { spawnSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { readFileSync, statSync, writeFileSync } from 'node:fs';
          const result = {};
          for (const variant of ['baseline', 'candidate']) {
            const directory = `.cache/native-performance/${variant}`;
            const binary = `${directory}/compiler`;
            const capture = JSON.parse(readFileSync(`${directory}/capture.json`, 'utf8'));
            const phases = JSON.parse(readFileSync(`${directory}/build-events.json`, 'utf8'));
            const size = spawnSync('size', ['--format=sysv', '--radix=10', binary], { encoding: 'utf8' });
            writeFileSync(`${directory}/binary-size.log`, `${size.stdout ?? ''}\n${size.stderr ?? ''}`);
            const textBytes = size.stdout?.match(/^\.text\s+(\d+)\s/m)?.[1];
            if (size.status !== 0 || textBytes === undefined) throw new Error(`No .text measurement for ${variant}`);
            const generated = phases.filter(event => event.phase === 'write generated C');
            if (generated.length === 0 || generated.some(event => typeof event.bytes !== 'number')) {
              throw new Error(`No generated C measurement for ${variant}`);
            }
            result[variant] = {
              source: capture.source,
              programSource: capture.programSource,
              build: capture.build,
              executableBytes: statSync(binary).size,
              executableSha256: createHash('sha256').update(readFileSync(binary)).digest('hex'),
              binaryTextBytes: Number(textBytes),
              generatedCBytes: generated.reduce((sum, event) => sum + event.bytes, 0),
            };
          }
          writeFileSync('.cache/native-performance/compiler-build-sizes.json', `${JSON.stringify(result, null, 2)}\n`);
          JS

      - name: Compare the parser slice
        id: parser
        if: steps.baseline.outputs.skip != 'true'
        run: |
          set -o pipefail
          node scripts/self-compile-experiment.ts compare \
            .cache/native-performance/baseline .cache/native-performance/candidate \
            --output .cache/native-performance/parser --workload parser --pairs 5 \
            --bun "$(command -v bun)" --budget-seconds 480 --plan=json | tee .cache/native-performance/parser-plan.json
          node scripts/self-compile-experiment.ts compare \
            .cache/native-performance/baseline .cache/native-performance/candidate \
            --output .cache/native-performance/parser --workload parser --pairs 5 \
            --bun "$(command -v bun)" --budget-seconds 480 2>&1 | tee .cache/native-performance/parser.log

      - name: Compare the shape-analysis slice
        if: >-
          !cancelled() && steps.baseline.outputs.skip != 'true' &&
          (steps.parser.outcome == 'success' || steps.parser.outcome == 'failure')
        run: |
          set -o pipefail
          node scripts/self-compile-experiment.ts compare \
            .cache/native-performance/baseline .cache/native-performance/candidate \
            --output .cache/native-performance/shape --workload shape --pairs 5 \
            --bun "$(command -v bun)" --budget-seconds 1500 --plan=json | tee .cache/native-performance/shape-plan.json
          node scripts/self-compile-experiment.ts compare \
            .cache/native-performance/baseline .cache/native-performance/candidate \
            --output .cache/native-performance/shape --workload shape --pairs 5 \
            --bun "$(command -v bun)" --budget-seconds 1500 2>&1 | tee .cache/native-performance/shape.log

      - name: Compare Node producer costs
        if: >-
          !cancelled() && steps.baseline.outputs.skip != 'true' &&
          !inputs.memory_policy && steps.node-captures.outcome == 'success'
        run: |
          set -o pipefail
          for workload in parser shape; do
            budget=240
            if [ "$workload" = shape ]; then budget=600; fi
            node scripts/self-compile-experiment.ts compare \
              .cache/native-performance/baseline-node .cache/native-performance/candidate-node \
              --output ".cache/native-performance/node-$workload" --workload "$workload" --pairs 5 --host node \
              --bun "$(command -v bun)" --budget-seconds "$budget" --plan=json \
              | tee ".cache/native-performance/node-$workload-plan.json"
            node scripts/self-compile-experiment.ts compare \
              .cache/native-performance/baseline-node .cache/native-performance/candidate-node \
              --output ".cache/native-performance/node-$workload" --workload "$workload" --pairs 5 --host node \
              --bun "$(command -v bun)" --budget-seconds "$budget" 2>&1 \
              | tee ".cache/native-performance/node-$workload.log"
          done

      - name: Retain compiler slice evidence before full comparisons
        if: >-
          always() && steps.baseline.outputs.skip != 'true' &&
          (inputs.compiler_program == 'revision' || inputs.memory_policy)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-compiler-slices-${{ github.event.pull_request.number || 'main' }}-${{ matrix.comparison }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/native-performance/parser/**/*.json
            .cache/native-performance/parser/**/*.log
            .cache/native-performance/shape/**/*.json
            .cache/native-performance/shape/**/*.log
            .cache/native-performance/node-parser/**/*.json
            .cache/native-performance/node-parser/**/*.log
            .cache/native-performance/node-shape/**/*.json
            .cache/native-performance/node-shape/**/*.log
            .cache/native-performance/baseline/capture.json
            .cache/native-performance/candidate/capture.json
            .cache/native-performance/baseline-node/capture.json
            .cache/native-performance/candidate-node/capture.json
            .cache/native-performance/compiler-build-sizes.json
            .cache/native-performance/environment.log
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

      - name: Compare full native compiler revisions
        if: >-
          !cancelled() && steps.baseline.outputs.skip != 'true' &&
          inputs.compiler_program == 'revision' && !inputs.memory_policy &&
          steps.baseline-native.outcome == 'success' && steps.candidate-native.outcome == 'success'
        run: |
          set -o pipefail
          node scripts/self-compile-experiment.ts compare \
            .cache/native-performance/baseline .cache/native-performance/candidate \
            --output .cache/native-performance/full-native --workload full --pairs 3 --host native \
            --bun "$(command -v bun)" --budget-seconds 5400 --plan=json \
            | tee .cache/native-performance/full-native-plan.json
          node scripts/self-compile-experiment.ts compare \
            .cache/native-performance/baseline .cache/native-performance/candidate \
            --output .cache/native-performance/full-native --workload full --pairs 3 --host native \
            --bun "$(command -v bun)" --budget-seconds 5400 2>&1 \
            | tee .cache/native-performance/full-native.log

      - name: Compare full Node compiler revisions
        if: >-
          !cancelled() && steps.baseline.outputs.skip != 'true' &&
          inputs.compiler_program == 'revision' && !inputs.memory_policy &&
          steps.node-captures.outcome == 'success'
        run: |
          set -o pipefail
          node scripts/self-compile-experiment.ts compare \
            .cache/native-performance/baseline-node .cache/native-performance/candidate-node \
            --output .cache/native-performance/full-node --workload full --pairs 3 --host node \
            --bun "$(command -v bun)" --budget-seconds 2400 --plan=json \
            | tee .cache/native-performance/full-node-plan.json
          node scripts/self-compile-experiment.ts compare \
            .cache/native-performance/baseline-node .cache/native-performance/candidate-node \
            --output .cache/native-performance/full-node --workload full --pairs 3 --host node \
            --bun "$(command -v bun)" --budget-seconds 2400 2>&1 \
            | tee .cache/native-performance/full-node.log

      - name: Compare the compiler nursery cap without tracing
        if: >-
          !cancelled() && steps.baseline.outputs.skip != 'true' &&
          github.event_name == 'workflow_dispatch' && inputs.memory_policy
        run: |
          set -o pipefail
          node scripts/self-compile-experiment.ts compare \
            .cache/native-performance/candidate .cache/native-performance/candidate \
            --output .cache/native-performance/nursery-ordinary --workload full --pairs 3 \
            --shared-oracle --candidate-nursery-max-bytes 67108864 \
            --bun "$(command -v bun)" --budget-seconds 5400 --plan=json | tee .cache/native-performance/nursery-ordinary-plan.json
          node scripts/self-compile-experiment.ts compare \
            .cache/native-performance/candidate .cache/native-performance/candidate \
            --output .cache/native-performance/nursery-ordinary --workload full --pairs 3 \
            --shared-oracle --candidate-nursery-max-bytes 67108864 \
            --bun "$(command -v bun)" --budget-seconds 5400 2>&1 | tee .cache/native-performance/nursery-ordinary.log

      - name: Attribute compiler memory in separate diagnostic runs
        if: >-
          !cancelled() && steps.baseline.outputs.skip != 'true' &&
          github.event_name == 'workflow_dispatch' && inputs.memory_policy
        run: |
          set -o pipefail
          node scripts/self-compile-experiment.ts compare \
            .cache/native-performance/candidate .cache/native-performance/candidate \
            --output .cache/native-performance/nursery-memory --workload full --pairs 1 \
            --shared-oracle --gc-memory --gc-memory-interval 256 --candidate-nursery-max-bytes 67108864 \
            --bun "$(command -v bun)" --budget-seconds 3600 --plan=json | tee .cache/native-performance/nursery-memory-plan.json
          node scripts/self-compile-experiment.ts compare \
            .cache/native-performance/candidate .cache/native-performance/candidate \
            --output .cache/native-performance/nursery-memory --workload full --pairs 1 \
            --shared-oracle --gc-memory --gc-memory-interval 256 --candidate-nursery-max-bytes 67108864 \
            --bun "$(command -v bun)" --budget-seconds 3600 2>&1 | tee .cache/native-performance/nursery-memory.log

      - name: Remove disposable baseline source and dependency links
        if: always() && steps.baseline.outputs.skip != 'true'
        run: |
          rm -rf .cache/native-performance/baseline-source
          if [ -d .cache/native-performance ]; then
            find .cache/native-performance -path '*/source/node_modules' -type l -delete
          fi

      - name: Retain compiler comparison evidence
        if: always() && steps.baseline.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-compiler-${{ github.event.pull_request.number || 'main' }}-${{ matrix.comparison }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/native-performance/**/*.json
            .cache/native-performance/**/*.log
            .cache/native-performance/**/*.patch
            .cache/native-performance/**/*.md
            .cache/native-performance/**/*.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
