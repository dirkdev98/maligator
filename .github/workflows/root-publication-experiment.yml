name: Root publication candidate

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  evaluate:
    if: >-
      github.event.label.name == 'evaluate-entry-stable-roots' &&
      github.event.pull_request.number == 65 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-linux
      - name: Establish native environment
        run: |
          sudo apt-get install --yes llvm-19 lld-19
          mkdir -p "$RUNNER_TEMP/native-bin" .cache/root-candidate
          ln -s "$(command -v llvm-ar-19)" "$RUNNER_TEMP/native-bin/ar"
          ln -s "$(command -v ld.lld-19)" "$RUNNER_TEMP/native-bin/ld.lld"
          echo "$RUNNER_TEMP/native-bin" >> "$GITHUB_PATH"
          npm run env:check -- --json | tee .cache/root-candidate/environment.log
          node ./src/index.ts cache status
      - name: Recover the frozen entry-stable experiment
        run: |
          git show 0689b2bcef0d74234ae39d07fa68bb133f97a38b:.github/workflows/root-publication-experiment.yml > .cache/root-candidate/v2.yml
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {parse} from 'yaml';
          const steps=parse(readFileSync('.cache/root-candidate/v2.yml','utf8')).jobs.evaluate.steps;
          for(const [name,file] of [
            ['Recover the exact initial experiment commands','initialize.sh'],
            ['Apply candidate and migrate the publication contract assertion','apply-v2.sh'],
          ]) writeFileSync(`.cache/root-candidate/${file}`,steps.find(step=>step.name===name).run);
          JS
          bash .cache/root-candidate/initialize.sh
      - name: Build the original microbenchmarks
        run: bash .cache/root-candidate/prepare.sh | tee .cache/root-candidate/baseline-build.log
      - name: Apply entry-stable roots and conditional operator masks
        run: |
          bash .cache/root-candidate/apply-v2.sh
          python3 - <<'PY'
          from pathlib import Path
          file=Path('src/compiler/target/render-native-c.ts'); source=file.read_text()
          def change(old,new,count=1):
              global source
              assert source.count(old)==count,(old[:100],source.count(old))
              source=source.replace(old,new)
          change('\t\tconst inactiveRootMask = inactiveRootMasks.get(ip);\n', '\t\tconst inactiveRootMask = inactiveRootMasks.get(ip);\n\t\tconst operatorInactiveRootMask =\n\t\t\tdeferredOperatorRoots && inactiveRootMask !== lastPublishedInactiveRootMask\n\t\t\t\t? inactiveRootMask\n\t\t\t\t: undefined;\n')
          change('\t\t\tmathCallInactiveRootMask === undefined &&\n','\t\t\toperatorInactiveRootMask === undefined &&\n\t\t\tmathCallInactiveRootMask === undefined &&\n',2)
          change('\t\t\tmathCallInactiveRootMask !== undefined ||\n','\t\t\toperatorInactiveRootMask !== undefined ||\n\t\t\tmathCallInactiveRootMask !== undefined ||\n')
          change('\t\t\t\t\t\t? incomingRootPublication\n\t\t\t\t\t\t: [],', '\t\t\t\t\t\t? operatorInactiveRootMask === undefined\n\t\t\t\t\t\t\t? incomingRootPublication\n\t\t\t\t\t\t\t: [...incomingRootPublication, `${cInactiveRootMaskPublication(operatorInactiveRootMask)};`]\n\t\t\t\t\t\t: [],')
          file.write_text(source)
          doc=Path('docs/decisions/native-root-publication.md')
          with doc.open('a') as output:
              output.write('\nBinary numeric guards leave the root mask untouched on their noncollecting\npath. The original union mask is published with incoming private roots inside\nthe coercing operator expression, before it can call user code. A conditional\npublication invalidates the emitter\'s known-mask state for the next operation;\npure specialized operators need no mask update at all.\n')
          fixture=Path('tests/local/static-property-root-mask.js')
          extra='''
          function retainThroughNumberCoercion(holder, operand) {
              const retained = holder.value;
              const result = operand + 1;
              gc();
              return result + retained.marker;
          }
          function retainThroughStringCoercion(holder, operand) {
              const retained = holder.value;
              const result = operand + 1;
              gc();
              return result + retained.marker;
          }
          function retainThroughThrowingCoercion(holder, operand) {
              const retained = holder.value;
              try {
                  return operand + 1;
              } catch (error) {
                  gc();
                  return retained.marker + error.marker;
              }
          }
          globalThis.rootCoercionReaders = [retainThroughNumberCoercion, retainThroughStringCoercion, retainThroughThrowingCoercion];
          for (let index = 0; index < 16; index++) {
              const numberHolder = {value: {marker: 41}};
              const numberOperand = {valueOf() {numberHolder.value = null; gc(); return 17;}};
              if (globalThis.rootCoercionReaders[0](numberHolder, numberOperand) !== 59) throw new Error("coercion lost an earlier heap-valued root");
              const stringHolder = {value: {marker: 41}};
              const stringOperand = {[Symbol.toPrimitive](hint) {if (hint !== "default") throw new Error("wrong coercion hint"); stringHolder.value = null; gc(); return "v";}};
              if (globalThis.rootCoercionReaders[1](stringHolder, stringOperand) !== "v141") throw new Error("coercion lost its heap-valued result or preceding root");
              const throwHolder = {value: {marker: 41}};
              const throwOperand = {[Symbol.toPrimitive]() {throwHolder.value = null; gc(); throw {marker: 23};}};
              if (globalThis.rootCoercionReaders[2](throwHolder, throwOperand) !== 64) throw new Error("throwing coercion lost a catch root");
          }
          '''
          source=fixture.read_text(); marker='console.log("static-property-root-mask PASS");'
          assert source.count(marker)==1
          fixture.write_text(source.replace(marker,extra+'\n'+marker))
          owner=Path('tests/native/static-property-root-mask.test.ts'); source=owner.read_text()
          marker='const publicationKernels = [\n'; assert source.count(marker)==1
          entries=''.join('\t{ name: "'+name+'", boundary: "BINARY", probe: "mal_vm_binary_op", properties: ["value"], firstBoundaryOnly: true },\n' for name in ['retainThroughNumberCoercion','retainThroughStringCoercion','retainThroughThrowingCoercion'])
          source=source.replace(marker,marker+entries)
          marker='\t\t\t\t\t.map((safepoint) => safepoint.incomingRootRegisters ?? []),'
          assert source.count(marker)==1
          source=source.replace(marker,'\t\t\t\t\t.slice(0, "firstBoundaryOnly" in kernel ? 1 : undefined)\n'+marker)
          source=source.replace('retains private preceding roots at the emitted fast probe in $name','retains private preceding roots at the audited boundary in $name')
          owner.write_text(source)
          Path('tests/native-root-mask-edges.test.ts').write_text('''import { describe, expect, it } from "vitest";
          import { createConservativeNativePlan } from "../src/compiler/target/program-image.ts";
          import { emitCompiledFunction } from "../src/compiler/target/render-native-c.ts";
          import type { BytecodeFunction } from "../src/compiler/target/runtime-image.ts";
          describe("native binary root-mask edges", () => {
              it("publishes the original union mask inside the generic coercing edge, not the numeric hit", () => {
                  const fn: BytecodeFunction = {nameStringIndex:-1,isGenerator:false,isAsync:false,parameterCount:1,mappedArguments:false,mappedArgumentSlots:[],length:1,registerCount:3,capturedCount:0,strict:true,needsArguments:false,argumentSnapshotCount:0,argumentSnapshotPlan:[],isDerivedConstructor:false,isClassConstructor:false,constructorSlotReserve:0,hasPrototype:false,literalShapeCount:0,instructions:[{opcode:"LOAD_PROPERTY_STATIC",object:0,dst:1,stringIndex:0,icIndex:0},{opcode:"BINARY",dst:2,left:1,right:0,operator:"+"},{opcode:"RETURN",value:2}],handlers:[],fileIndex:-1,positions:[]};
                  const native = createConservativeNativePlan([fn]).functions[0]!;
                  const output = emitCompiledFunction(fn,{...native,gc:{safepoints:[{kind:"operation",instructionIp:0,rootRegisters:[0,1],incomingRootRegisters:[0],outgoingRootRegisters:[0,1]},{kind:"operation",instructionIp:1,rootRegisters:[0,1,2],incomingRootRegisters:[0,1],outgoingRootRegisters:[2]}]}},0,"",false)!.source;
                  const miss = output.indexOf("mal_vm_op_load_property_ic_static_miss");
                  const propertyEnd = output.indexOf("\\n    }",miss);
                  const guard = output.indexOf("if (mal_ops_is_number",propertyEnd);
                  const call = output.indexOf("mal_vm_binary_op",guard);
                  const fallback = output.lastIndexOf("} else {",call);
                  expect(miss).toBeGreaterThan(0);
                  expect(propertyEnd).toBeGreaterThan(miss);
                  expect(guard).toBeGreaterThan(propertyEnd);
                  expect(call).toBeGreaterThan(guard);
                  expect(fallback).toBeGreaterThan(guard);
                  expect(output.slice(propertyEnd,fallback)).not.toContain("MAL_ROOT_MASK(");
                  expect(output.slice(fallback,call)).toContain("MAL_ROOT_MASK(0x0)");
                  expect(output.slice(fallback,call)).toContain("__gc_slots[1] = r1");
              });
          });
          ''')
          store=Path('.cache/root-candidate/store.sh'); source=store.read_text()
          marker="'tests/program-image-emission.test.ts'];"; assert source.count(marker)==1
          source=source.replace(marker,"'tests/program-image-emission.test.ts','tests/native-root-mask-edges.test.ts','tests/local/static-property-root-mask.js','tests/native/static-property-root-mask.test.ts'];")
          source='git add --intent-to-add tests/native-entry-stable-roots.test.ts tests/native-root-mask-edges.test.ts\n'+source
          store.write_text(source)
          PY
          ./node_modules/.bin/oxfmt src/compiler/target/render-native-c.ts docs/decisions/native-root-publication.md tests/native-root-mask-edges.test.ts tests/local/static-property-root-mask.js tests/native/static-property-root-mask.test.ts
          git diff --stat
      - name: Type checking and exact root contracts
        run: |
          npm run type-check
          npm run test:unit -- --run tests/native-entry-stable-roots.test.ts tests/native-root-mask-edges.test.ts tests/program-image-emission.test.ts tests/execution-liveness-transfers.test.ts tests/execution-verification.test.ts
      - name: Native collection and coercion contracts
        run: |
          node --expose-gc --input-type=module -e 'globalThis.__mal_collect_garbage = globalThis.gc; await import("./tests/local/static-property-root-mask.js");'
          npm run test:native -- tests/native/static-property-root-mask.test.ts
          npm run test:sanitize -- tests/native/static-property-root-mask.test.ts
      - name: Measure matched microbenchmarks
        run: |
          node .cache/root-candidate/micro.mjs candidate | tee .cache/root-candidate/candidate-build.log
          node .cache/root-candidate/micro.mjs measure | tee .cache/root-candidate/micro-summary.log
      - name: Store tested tree without moving a branch
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          bash .cache/root-candidate/store.sh
          echo "tree=$(node -p 'JSON.parse(require("fs").readFileSync(".cache/root-candidate/publication.json")).tree_sha')" >> "$GITHUB_OUTPUT"
      - name: Retain tested candidate before the runtime comparison
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tested-root-tree-${{ steps.candidate.outputs.tree }}
          path: |
            .cache/root-candidate/publication.json
            .cache/root-candidate/candidate.patch
            .cache/root-candidate/micro-report.json
            .cache/root-candidate/micro-summary.log
          include-hidden-files: true
          retention-days: 7
      - name: Plan full JavaScript runtime comparison
        run: >-
          node scripts/bench.ts javascript --compare "$BASE_SHA"
          --runs 5 --max-pairs 7 --budget-seconds 1800 --plan=json
          | tee .cache/root-candidate/javascript-plan.json
      - name: Measure full JavaScript runtime
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/bench.ts javascript --compare "$BASE_SHA" \
            --runs 5 --max-pairs 7 --budget-seconds 1800 \
            2>&1 | tee .cache/root-candidate/javascript.log
      - name: Retain all candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: root-publication-edges-${{ github.run_id }}
          path: |
            .cache/root-candidate/*.json
            .cache/root-candidate/*.log
            .cache/root-candidate/*.patch
            .cache/bench-comparisons/*/*.json
            .cache/bench-comparisons/*/*.log
          include-hidden-files: true
          retention-days: 7
