name: Root publication candidate

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  evaluate:
    if: >-
      github.event.label.name == 'evaluate-entry-stable-roots' &&
      github.event.pull_request.number == 65 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: write
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-linux
      - name: Establish native environment
        run: |
          sudo apt-get install --yes llvm-19 lld-19
          mkdir -p "$RUNNER_TEMP/native-bin" .cache/root-candidate
          ln -s "$(command -v llvm-ar-19)" "$RUNNER_TEMP/native-bin/ar"
          ln -s "$(command -v ld.lld-19)" "$RUNNER_TEMP/native-bin/ld.lld"
          echo "$RUNNER_TEMP/native-bin" >> "$GITHUB_PATH"
          npm run env:check -- --json | tee .cache/root-candidate/environment.log
          node ./src/index.ts cache status
      - name: Recover the exact initial experiment commands
        run: |
          git show e91c04f1b83af8899289529eb47c8ce8cd6e991b:.github/workflows/root-publication-experiment.yml > .cache/root-candidate/original.yml
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {parse} from 'yaml';
          const steps=parse(readFileSync('.cache/root-candidate/original.yml','utf8')).jobs.evaluate.steps;
          const extract=(name,file)=>writeFileSync(`.cache/root-candidate/${file}`,steps.find(step=>step.name===name).run);
          extract('Prepare matched construction and traversal probes','prepare.sh');
          extract('Apply the isolated publication candidate','apply.sh');
          extract('Store tested Git objects without updating a branch','store.sh');
          const path='.cache/root-candidate/store.sh';
          const source=readFileSync(path,'utf8');
          const old="'docs/decisions/native-root-publication.md'];";
          if(!source.includes(old)) throw Error('Missing publication file list');
          writeFileSync(path,source.replace(old,"'docs/decisions/native-root-publication.md','tests/program-image-emission.test.ts'];"));
          JS
      - name: Build the original six microbenchmarks
        run: bash .cache/root-candidate/prepare.sh | tee .cache/root-candidate/baseline-build.log
      - name: Apply candidate and migrate the publication contract assertion
        run: |
          bash .cache/root-candidate/apply.sh
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          const path='tests/program-image-emission.test.ts';
          const lines=readFileSync(path,'utf8').split('\n');
          const matches=lines.map((line,index)=>line.includes('expect(fallback).toMatch(new RegExp') && line.includes('${store.object}') ? index : -1).filter(index=>index>=0);
          if(matches.length!==1) throw Error('Expected exactly one old store receiver assertion');
          const replacement=String.raw`
          const retained = fn.instructions.find((instruction) => instruction.opcode === "LOAD_PROPERTY_STATIC");
          if (retained?.opcode !== "LOAD_PROPERTY_STATIC") throw new Error("missing retained property value");
          expect(retained.dst).not.toBe(store.object);
          expect(output).toContain(String.raw\`#define r\${retained.dst} (__private_r\${retained.dst})\`);
          const receiverPublication = new RegExp(String.raw\`__gc_slots\\[\\d+\\] = r\${store.object};\`, "g");
          expect(output.match(receiverPublication)).toHaveLength(1);
          expect(output.slice(0, output.indexOf("mal_root_frame_head = &__gc_frame"))).toMatch(receiverPublication);
          expect(fallback).not.toMatch(receiverPublication);
          expect(fallback).toMatch(new RegExp(String.raw\`__gc_slots\\[\\d+\\] = r\${retained.dst};\`));
          `.replaceAll('String.raw\\`','`').replaceAll('\\`','`').replaceAll('\\${','${');
          lines.splice(matches[0],1,replacement);
          writeFileSync(path,lines.join('\n'));
          JS
          ./node_modules/.bin/oxfmt tests/program-image-emission.test.ts
          git diff -- tests/program-image-emission.test.ts
      - name: Type checking and exact root contracts
        run: |
          npm run type-check
          npm run test:unit -- --run tests/native-entry-stable-roots.test.ts tests/program-image-emission.test.ts tests/execution-liveness-transfers.test.ts tests/execution-verification.test.ts
      - name: Native collecting and throwing paths
        run: |
          npm run test:native -- tests/native/static-property-root-mask.test.ts
          npm run test:sanitize -- tests/native/static-property-root-mask.test.ts
      - name: Measure matched microbenchmarks
        run: |
          node .cache/root-candidate/micro.mjs candidate | tee .cache/root-candidate/candidate-build.log
          node .cache/root-candidate/micro.mjs measure | tee .cache/root-candidate/micro-summary.log
      - name: Store reviewed candidate tree without moving a branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: bash .cache/root-candidate/store.sh
      - name: Plan full JavaScript runtime comparison
        run: >-
          node scripts/bench.ts javascript --compare "$BASE_SHA"
          --runs 5 --max-pairs 7 --budget-seconds 1800 --plan=json
          | tee .cache/root-candidate/javascript-plan.json
      - name: Measure full JavaScript runtime
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/bench.ts javascript --compare "$BASE_SHA" \
            --runs 5 --max-pairs 7 --budget-seconds 1800 \
            2>&1 | tee .cache/root-candidate/javascript.log
      - name: Retain candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: entry-stable-roots-${{ github.run_id }}
          path: |
            .cache/root-candidate/*.json
            .cache/root-candidate/*.log
            .cache/root-candidate/*.patch
            .cache/bench-comparisons/*/*.json
            .cache/bench-comparisons/*/*.log
          include-hidden-files: true
          retention-days: 7
