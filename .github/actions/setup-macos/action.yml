name: Set up Maligator on macOS
description: Install the pinned Node and Rust toolchains, dependencies, and bounded CI caches.

inputs:
  node-version:
    description: Exact Node.js version used by Maligator CI.
    required: false
    default: 24.14.1
  cache-test262:
    description: Restore and save the pinned Test262 corpus.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Select the pinned Rust toolchain
      shell: bash
      run: |
        xcode-select --print-path
        rustup_home="$RUNNER_TEMP/rustup-home"
        cargo_home="$RUNNER_TEMP/cargo-home"
        rustup_init="$RUNNER_TEMP/rustup-init"
        # The hosted ARM image's Homebrew Rustup can install unusable proxies: https://github.com/actions/runner-images/issues/14097
        curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
          https://static.rust-lang.org/rustup/archive/1.29.0/aarch64-apple-darwin/rustup-init \
          --output "$rustup_init"
        echo "aeb4105778ca1bd3c6b0e75768f581c656633cd51368fa61289b6a71696ac7e1  $rustup_init" | shasum -a 256 --check
        chmod +x "$rustup_init"
        RUSTUP_HOME="$rustup_home" CARGO_HOME="$cargo_home" \
          "$rustup_init" -y --no-modify-path --default-toolchain none
        rustup="$cargo_home/bin/rustup"
        toolchain="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' runtime/rust/rust-toolchain.toml)"
        test -n "$toolchain"
        RUSTUP_HOME="$rustup_home" "$rustup" toolchain install "$toolchain" --profile minimal --no-self-update
        export RUSTUP_HOME="$rustup_home"
        export RUSTUP_TOOLCHAIN="$toolchain"
        "$rustup" which cargo
        "$rustup" which rustc
        "$("$rustup" which cargo)" --version
        "$("$rustup" which rustc)" --version
        echo "RUSTUP_HOME=$rustup_home" >> "$GITHUB_ENV"
        echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
        echo "$cargo_home/bin" >> "$GITHUB_PATH"

    - name: Configure the bounded Maligator cache
      shell: bash
      run: |
        echo "MALIGATOR_CACHE_DIR=$RUNNER_TEMP/maligator-cache" >> "$GITHUB_ENV"
        mkdir -p "$RUNNER_TEMP/maligator-cache"

    - name: Restore the pinned Test262 corpus
      if: inputs.cache-test262 == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/maligator-cache/v1/test262-corpora
        key: test262-corpus-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/test262/constants.ts') }}

    - name: Install JavaScript dependencies
      shell: bash
      run: npm ci --no-audit --no-fund

    - name: Prepare the pinned Test262 corpus
      if: inputs.cache-test262 == 'true'
      shell: bash
      run: npm run test262:prepare
