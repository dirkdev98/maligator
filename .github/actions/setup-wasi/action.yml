name: Set up WASI
description: Install the pinned WASI SDK and Rust target.

runs:
  using: composite
  steps:
    - name: Install WASI SDK 34
      shell: bash
      run: |
        archive="$RUNNER_TEMP/wasi-sdk.tar.gz"
        # GitHub release downloads intermittently answer 504; retry with backoff.
        curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
          --retry 5 --retry-all-errors \
          https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz \
          --output "$archive"
        echo "b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4  $archive" | sha256sum --check
        tar -xzf "$archive" -C "$RUNNER_TEMP"
        echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk-34.0-x86_64-linux" >> "$GITHUB_ENV"
        rustup target add wasm32-wasip1
