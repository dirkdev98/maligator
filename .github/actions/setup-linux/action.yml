name: Set up Maligator on Linux
description: Install the pinned Node, native toolchain, dependencies, and bounded CI caches.

inputs:
  node-version:
    description: Exact Node.js version used by Maligator CI.
    required: false
    default: 26.12.0
  cache-test262:
    description: Restore and save the pinned Test262 corpus.
    required: false
    default: "false"
  native-cache:
    description: Cache line for completed Rust runtime libraries, or empty to build them cold.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Select Clang 21
      shell: bash
      run: |
        if ! command -v clang-21 >/dev/null || ! command -v clang++-21 >/dev/null || ! command -v llvm-ar-21 >/dev/null; then
          sudo apt-get update
          sudo apt-get install --yes clang-21 llvm-21
        fi
        echo "CC=clang-21" >> "$GITHUB_ENV"
        echo "CXX=clang++-21" >> "$GITHUB_ENV"

    - name: Select the pinned Rust toolchain
      shell: bash
      run: |
        toolchain="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' runtime/rust/rust-toolchain.toml)"
        test -n "$toolchain"
        rustup toolchain install "$toolchain" --profile minimal --no-self-update
        export RUSTUP_TOOLCHAIN="$toolchain"
        rustup which cargo
        rustup which rustc
        echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

    - name: Configure the bounded Maligator cache
      shell: bash
      run: |
        cache="$RUNNER_TEMP/maligator-cache"
        # Native lanes write tens of gigabytes of objects and eval-enabled binaries. Use the
        # larger ephemeral disk when present, and never the 8 GB tmpfs some images mount on
        # /tmp: test binaries there filled it mid-link with most of the root disk still free.
        if mountpoint -q /mnt &&
          (( $(df --output=avail -B1 /mnt | tail -1) > $(df --output=avail -B1 "$RUNNER_TEMP" | tail -1) )); then
          sudo install -d -o "$(id -u)" -g "$(id -g)" /mnt/maligator-cache /mnt/maligator-tmp
          ln -sfn /mnt/maligator-cache "$cache"
          echo "TMPDIR=/mnt/maligator-tmp" >> "$GITHUB_ENV"
        else
          mkdir -p "$cache" "$RUNNER_TEMP/maligator-tmp"
          echo "TMPDIR=$RUNNER_TEMP/maligator-tmp" >> "$GITHUB_ENV"
        fi
        echo "MALIGATOR_CACHE_DIR=$cache" >> "$GITHUB_ENV"
        df -h / /mnt 2>/dev/null || df -h /

    - name: Restore the pinned Test262 corpus
      if: inputs.cache-test262 == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/maligator-cache/v1/test262-corpora
        key: test262-corpus-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/test262/constants.ts') }}

    - name: Install JavaScript dependencies
      shell: bash
      run: npm ci --no-audit --no-fund

    - name: Select the native library cache
      id: native-cache
      if: inputs.native-cache != ''
      shell: bash
      env:
        NATIVE_CACHE: ${{ inputs.native-cache }}
      run: |
        prefix="maligator-native-v1-$RUNNER_OS-$RUNNER_ARCH-$ImageOS-$NATIVE_CACHE-"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "MALIGATOR_NATIVE_CACHE_PREFIX=$prefix" >> "$GITHUB_ENV"

    - name: Restore the native library cache
      id: restore-native-cache
      if: inputs.native-cache != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/maligator-native-cache
        key: ${{ steps.native-cache.outputs.prefix }}${{ github.run_id }}
        restore-keys: ${{ steps.native-cache.outputs.prefix }}

    - name: Import the native library cache
      if: inputs.native-cache != ''
      shell: bash
      env:
        RESTORED_KEY: ${{ steps.restore-native-cache.outputs.cache-matched-key }}
      run: |
        node scripts/ci-native-cache.ts import "$RUNNER_TEMP/maligator-native-cache"
        echo "MALIGATOR_NATIVE_CACHE_RESTORED_KEY=$RESTORED_KEY" >> "$GITHUB_ENV"

    - name: Prepare the pinned Test262 corpus
      if: inputs.cache-test262 == 'true'
      shell: bash
      run: npm run test262:prepare
