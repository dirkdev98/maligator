name: Save the native library cache
description: Publish the native actions a main-branch job used, when the set changed.

runs:
  using: composite
  steps:
    # One job per lane owns the lane's shared snapshot, so a runtime or compiler change
    # uploads it once instead of from every job that rebuilt the same libraries.
    - name: Export the shared native library cache
      id: export-shared
      if: ${{ !cancelled() && env.MALIGATOR_NATIVE_CACHE_PREFIX != '' && env.MALIGATOR_NATIVE_SHARED_OWNER == 'true' && github.ref == 'refs/heads/main' }}
      shell: bash
      run: node scripts/ci-native-cache.ts export "$RUNNER_TEMP/maligator-native-shared-export" --shared

    - name: Save the shared native library cache
      id: save-shared
      if: ${{ !cancelled() && steps.export-shared.outputs.digest != '' && steps.export-shared.outputs.digest != env.MALIGATOR_NATIVE_SHARED_RESTORED }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/maligator-native-shared-export
        key: ${{ env.MALIGATOR_NATIVE_SHARED_PREFIX }}${{ steps.export-shared.outputs.digest }}

    - name: Export the native library cache
      id: export
      if: ${{ !cancelled() && env.MALIGATOR_NATIVE_CACHE_PREFIX != '' && github.ref == 'refs/heads/main' }}
      shell: bash
      run: |
        if [ "$MALIGATOR_NATIVE_SHARED_OWNER" = true ]; then
          node scripts/ci-native-cache.ts export "$RUNNER_TEMP/maligator-native-cache" --without-shared
        else
          node scripts/ci-native-cache.ts export "$RUNNER_TEMP/maligator-native-cache" --without "$RUNNER_TEMP/maligator-native-shared-export"
        fi

    - name: Save the native library cache
      id: save
      if: ${{ !cancelled() && steps.export.outputs.digest != '' && steps.export.outputs.digest != env.MALIGATOR_NATIVE_CACHE_RESTORED }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/maligator-native-cache
        key: ${{ env.MALIGATOR_NATIVE_CACHE_PREFIX }}${{ steps.export.outputs.digest }}

    # Actions reports an unsuccessful cache write as a warning. Confirm the replacement
    # exists before removing the restored snapshot, which would otherwise keep its LRU slot.
    - name: Drop superseded snapshots
      if: ${{ !cancelled() && (steps.save-shared.outcome == 'success' || steps.save.outcome == 'success') }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SHARED_REPLACEMENT: ${{ steps.save-shared.outcome == 'success' && format('{0}{1}', env.MALIGATOR_NATIVE_SHARED_PREFIX, steps.export-shared.outputs.digest) || '' }}
        LINE_REPLACEMENT: ${{ steps.save.outcome == 'success' && format('{0}{1}', env.MALIGATOR_NATIVE_CACHE_PREFIX, steps.export.outputs.digest) || '' }}
      run: |
        drop_superseded() {
          local prefix="$1" restored="$2" replacement="$3"
          if [[ -z "$prefix" || "$restored" != "$prefix"* || -z "$replacement" || "$restored" == "$replacement" ]]; then
            return
          fi
          local published
          if ! published=$(gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "$replacement" --json key --jq '.[].key') ||
            ! grep -Fxq -- "$replacement" <<< "$published"; then
            echo "Keeping $restored until its replacement is published."
            return
          fi
          gh cache delete "$restored" --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" ||
            echo "Could not remove the superseded snapshot $restored."
        }
        drop_superseded "$MALIGATOR_NATIVE_SHARED_PREFIX" "$MALIGATOR_NATIVE_SHARED_RESTORED_KEY" "$SHARED_REPLACEMENT"
        drop_superseded "$MALIGATOR_NATIVE_CACHE_PREFIX" "$MALIGATOR_NATIVE_CACHE_RESTORED_KEY" "$LINE_REPLACEMENT"
