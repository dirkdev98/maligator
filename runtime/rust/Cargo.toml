[package]
name = "mal_rust"
version = "0.1.0"
edition = "2021"
publish = false
description = "The Maligator runtime's Rust FFI shim: ICU4X (Intl), regress (RegExp), and later temporal_rs (Temporal)."

# A single C-linkable static archive for ALL the runtime's Rust-backed
# primitives. It is one crate (not several) because two Rust staticlibs cannot be
# linked into one binary — each bundles its own std panic runtime (duplicate
# rust_eh_personality / EMPTY_PANIC symbols). The Maligator C runtime owns all
# JS-spec glue; this crate exposes only flat primitives over the C ABI, with one
# header per domain (mal_i18n.h, mal_regexp.h).
[lib]
name = "mal_rust"
crate-type = ["staticlib"]

[dependencies]
# Bundled IANA tzdb for Date's LocalTZA (deterministic offsets, not the host's
# /usr/share/zoneinfo). The system zone *identity* still comes from TZ / the
# /etc/localtime symlink via TimeZone::system().
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
# ICU4X for the Intl surface. Optional + gated behind the `intl` feature so an
# ICU4X for the Intl surface — one optional sub-crate PER ECMA-402 service (not the
# `icu` meta-crate, which pulls every component non-optionally). This lets the build
# config select services (engine.intl.features): an unselected service's crate isn't
# compiled, so its compiled_data (baked CLDR) never lands in the binary. `icu_locale`
# + `writeable` are the always-on floor (locale parsing / negotiation + result
# stringification). Sizes are dominated by locale-INDEPENDENT per-service data —
# Segmenter's LSTM models alone are ~12 MB, Collator's root table ~4 MB.
# `alloc` on decimal/datetime/calendar/time/list matches what the `icu` meta-crate
# enabled: it gates the `format_to_string` / Display impls our FFI stringifies with.
icu_locale = { version = "2", optional = true }
icu_collator = { version = "2", optional = true }
icu_decimal = { version = "2", optional = true, features = ["alloc"] }
icu_datetime = { version = "2", optional = true }
icu_calendar = { version = "2", optional = true, features = ["alloc"] }
icu_time = { version = "2", optional = true, features = ["alloc"] }
icu_plurals = { version = "2", optional = true }
icu_list = { version = "2", optional = true, features = ["alloc"] }
icu_segmenter = { version = "2", optional = true }
# Experimental ICU services (one crate for all three): DisplayNames,
# RelativeTimeFormat, Duration. Their CLDR data is all-or-nothing at the crate level.
icu_experimental = { version = "0.5", optional = true }
# Writeable: stringify ICU "formatted" results that expose Writeable (not Display).
writeable = { version = "0.6", optional = true }
# temporal_rs joins here for the Temporal global.
temporal_capi = { version = "0.2.6", default-features = false, optional = true }
# regress: the ECMAScript RegExp engine (the one Boa uses). Lives in this crate
# rather than its own because two Rust staticlibs can't co-link (duplicate std
# panic-runtime symbols). The `utf16` feature matches over &[u16] with no UTF-8
# conversion. Optional + gated behind the `regexp` feature (engine.regexp): off
# drops the regex engine + its Unicode tables. See src/regexp.rs +
# docs/decisions/03-regexp.md.
regress = { version = "0.11", features = ["utf16"], optional = true }
# ada-url: the WHATWG URL parser (wraps the C++ `ada` library). Optional + gated
# behind the `web-platform` feature (engine surface.webPlatform): dropping it drops
# the C++ URL parser AND its C++ runtime link argument. The native artifact resolver
# appends that argument only when web-platform is on. See src/url.rs + mal_url.h.
ada-url = { version = "3", optional = true }
# Pure-Rust streaming codecs for the node:zlib backend. `zlib-rs` is selected
# explicitly so enabling Node never introduces a system libz dependency.
flate2 = { version = "1", default-features = false, features = [
	"zlib-rs",
], optional = true }
brotli-decompressor = { version = "5", optional = true }
rustls = { version = "0.23", default-features = false, features = [
	"ring",
	"std",
	"tls12",
], optional = true }
rustls-pemfile = { version = "2", optional = true }
# Argon2 (RFC 9106) for node:crypto's argon2/argon2Sync. `sru-systems/rust-argon2`
# rather than RustCrypto's `argon2`: the latter caps associated data at 32 bytes
# (Params::MAX_DATA_LEN), while Node accepts up to 2^32-1, which would be a
# parity break. `default-features = false` drops crossbeam-utils and forces
# ThreadMode::Sequential — output is bit-identical to the parallel mode and the
# derivation already runs on Maligator's own worker thread.
rust-argon2 = { version = "3", default-features = false, optional = true }

[features]
# On by default so dev/test262 builds carry the full Intl + web + RegExp surface.
# The build maps the resolved config to an explicit feature set (src/rust-build.ts):
# Intl services via intl-*, the URL (ada) parser via web-platform, the RegExp engine
# via regexp. jiff (tz) is non-optional and always builds.
default = ["intl-full", "web-platform", "regexp"]

# The WHATWG URL surface: the ada-url (C++) parser. Off drops ada + the `-lc++`
# link. Maps to engine surface.webPlatform (rust-build.ts) + C `-DMAL_WEB_PLATFORM`.
web-platform = ["dep:ada-url"]

# The RegExp engine (regress). Off drops the regex engine + its Unicode tables.
# Maps to engine.regexp (rust-build.ts) + C `-DMAL_REGEXP`.
regexp = ["dep:regress"]

# ECMAScript Temporal through temporal_rs's generated stable C interface. Its
# compiled_data provider embeds deterministic IANA time-zone data only when the
# build config selects engine.temporal.
temporal = ["dep:temporal_capi", "temporal_capi/compiled_data"]

# node:zlib phase 1: decompression-only flat primitives. The C/JS adapters remain
# outside this feature; Node builds select it through normalizeNativeFeatures.
node-zlib = ["dep:flate2", "dep:brotli-decompressor"]
node-tls = ["dep:rustls", "dep:rustls-pemfile"]
node-argon2 = ["dep:rust-argon2"]

# The always-on Intl floor: locale parsing/negotiation (Intl.Locale,
# getCanonicalLocales, maximize/minimize) + result stringification. Every service
# feature enables it. ~0.2 MB.
intl = ["dep:icu_locale", "icu_locale/compiled_data", "dep:writeable"]

# One feature per ECMA-402 service. Each pulls its icu sub-crate(s) + compiled_data;
# cargo resolves the transitive DATA crates (e.g. icu_collator/compiled_data pulls
# icu_normalizer + icu_properties). Cross-service edges seen in lib.rs are explicit:
# DateTimeFormat constructs icu_calendar/icu_time inputs and renders via decimal;
# RelativeTime/Duration use decimal (+ plurals).
intl-collator = ["intl", "dep:icu_collator", "icu_collator/compiled_data"]
intl-number-format = ["intl", "dep:icu_decimal", "icu_decimal/compiled_data"]
intl-date-time-format = [
	"intl",
	"intl-number-format",
	"dep:icu_datetime",
	"icu_datetime/compiled_data",
	"dep:icu_calendar",
	"icu_calendar/compiled_data",
	"dep:icu_time",
	"icu_time/compiled_data",
]
intl-plural-rules = ["intl", "dep:icu_plurals", "icu_plurals/compiled_data"]
intl-list-format = ["intl", "dep:icu_list", "icu_list/compiled_data"]
intl-segmenter = ["intl", "dep:icu_segmenter", "icu_segmenter/compiled_data"]
intl-display-names = ["intl", "dep:icu_experimental", "icu_experimental/compiled_data"]
intl-relative-time-format = [
	"intl",
	"intl-number-format",
	"dep:icu_experimental",
	"icu_experimental/compiled_data",
]
intl-duration-format = [
	"intl",
	"intl-number-format",
	"intl-plural-rules",
	"dep:icu_experimental",
	"icu_experimental/compiled_data",
]

# Every service (the canonical dev/test262 build).
intl-full = [
	"intl-collator",
	"intl-number-format",
	"intl-date-time-format",
	"intl-plural-rules",
	"intl-list-format",
	"intl-segmenter",
	"intl-display-names",
	"intl-relative-time-format",
	"intl-duration-format",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
