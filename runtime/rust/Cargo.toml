[package]
name = "mal_rust"
version = "0.1.0"
edition = "2021"
publish = false
description = "The Maligator runtime's Rust FFI shim: ICU4X (Intl), regress (RegExp), and later temporal_rs (Temporal)."

# A single C-linkable static archive for ALL the runtime's Rust-backed
# primitives. It is one crate (not several) because two Rust staticlibs cannot be
# linked into one binary — each bundles its own std panic runtime (duplicate
# rust_eh_personality / EMPTY_PANIC symbols). The Maligator C runtime owns all
# JS-spec glue; this crate exposes only flat primitives over the C ABI, with one
# header per domain (mal_i18n.h, mal_regexp.h).
[lib]
name = "mal_rust"
crate-type = ["staticlib"]

[dependencies]
# Bundled IANA tzdb for Date's LocalTZA (deterministic offsets, not the host's
# /usr/share/zoneinfo). The system zone *identity* still comes from TZ / the
# /etc/localtime symlink via TimeZone::system().
jiff = { version = "0.2.42", features = ["tzdb-bundle-always"] }
# Separate optional ICU4X components let Wasm builds compile only the selected
# Intl services. Locale parsing, negotiation and result stringification use
# icu_locale and writeable in every Intl build.
icu_locale = { version = "2.4.0", optional = true }
icu_provider = { version = "2.4.0", optional = true }
fixed_decimal = { version = "0.7.3", optional = true }
icu_collator = { version = "2.4.0", optional = true }
icu_decimal = { version = "2.4.0", optional = true, features = ["alloc"] }
icu_datetime = { version = "2.4.0", optional = true }
icu_calendar = { version = "2.4.0", optional = true, features = ["alloc"] }
icu_time = { version = "2.4.0", optional = true, features = ["alloc"] }
icu_plurals = { version = "2.4.0", optional = true }
icu_list = { version = "2.4.0", optional = true, features = ["alloc"] }
icu_segmenter = { version = "2.4.0", optional = true }
# Experimental ICU services (one crate for all three): DisplayNames,
# RelativeTimeFormat, Duration. Their CLDR data is all-or-nothing at the crate level.
icu_experimental = { version = "0.7.0", optional = true }
# Writeable: stringify ICU "formatted" results that expose Writeable (not Display).
writeable = { version = "0.6.4", optional = true }
# temporal_rs joins here for the Temporal global.
temporal_capi = { version = "0.2.6", default-features = false, optional = true }
temporal_rs = { version = "0.2.6", default-features = false, optional = true }
# regress: the ECMAScript RegExp engine (the one Boa uses). Lives in this crate
# rather than its own because two Rust staticlibs can't co-link (duplicate std
# panic-runtime symbols). The `utf16` feature matches over &[u16] with no UTF-8
# conversion. See src/regexp.rs.
regress = { version = "0.12.0", path = "vendor/regress", features = [
	"utf16",
], optional = true }
# ada-url: the WHATWG URL parser (wraps the C++ `ada` library). Native links add
# its C++ library and runtime only when the build selects `url` (src/rust-build.ts).
# See src/url.rs.
ada-url = { version = "4.0.0", optional = true }
# Pure-Rust streaming codecs for the node:zlib backend. `zlib-rs` is selected
# explicitly so enabling Node never introduces a system libz dependency.
flate2 = { version = "1.1.11", default-features = false, features = [
	"zlib-rs",
], optional = true }
brotli-decompressor = { version = "6.3.1", optional = true }
# Pure-Rust Brotli encoder (no C library); it shares brotli-decompressor above.
brotli = { version = "9.1.1", default-features = false, features = [
	"std",
], optional = true }
# 0.23.46 or later: RUSTSEC-2026-0285.
rustls = { version = "0.23.46", default-features = false, features = [
	"ring",
	"std",
	"tls12",
], optional = true }
# Argon2 (RFC 9106) for node:crypto's argon2/argon2Sync. `sru-systems/rust-argon2`
# rather than RustCrypto's `argon2`: the latter caps associated data at 32 bytes
# (Params::MAX_DATA_LEN), while Node accepts up to 2^32-1, which would be a
# parity break. `default-features = false` drops crossbeam-utils and forces
# ThreadMode::Sequential — output is bit-identical to the parallel mode and the
# derivation already runs on Maligator's own worker thread.
rust-argon2 = { version = "3", default-features = false, optional = true }
# Symmetric ciphers for node:crypto's Cipheriv/Decipheriv. The block, stream
# and universal-hash crates are used directly rather than cbc / aes-gcm /
# chacha20poly1305, whose typestate and one-shot AEAD APIs would force update()
# to buffer whole messages; CBC, GCM and ChaCha20-Poly1305 are composed from them
# in src/crypto_cipher.rs. All are pure Rust with runtime CPU feature detection.
aes = { version = "0.9.4", optional = true }
ctr = { version = "0.10.1", default-features = false, optional = true }
ghash = { version = "0.6.0", default-features = false, optional = true }
chacha20 = { version = "0.10.2", default-features = false, features = [
	"cipher",
], optional = true }
poly1305 = { version = "0.9.1", default-features = false, optional = true }
# Asymmetric signing for node:crypto; already in the tree through rustls.
ring = { version = "0.17", optional = true }
rsa = { version = "0.10.0", default-features = false, features = [
	"std",
	"encoding",
], optional = true }

pkcs8 = { version = "0.11.0", features = [
	"encryption",
	"sha1-insecure",
	"std",
], optional = true }

zeroize = { version = "1.8", optional = true }

[features]
# Native builds compile every feature into one archive that all build
# configurations share; the final link keeps what the C runtime references.
# Wasm builds select the features of their configuration
# (normalizeNativeFeatures). jiff (tz) is non-optional and always builds.
default = ["intl-full", "url", "regexp"]

# The WHATWG URL surface: the ada-url (C++) parser.
url = ["dep:ada-url"]

# The RegExp engine (regress) and its Unicode tables.
regexp = ["dep:regress"]

# ECMAScript Temporal through temporal_rs's generated stable C interface. Its
# compiled_data provider embeds deterministic IANA time-zone data.
temporal = ["dep:temporal_capi", "temporal_capi/compiled_data"]

# node:zlib flat codec primitives (deflate, gzip and Brotli, both directions).
zlib = ["dep:flate2", "dep:brotli-decompressor", "dep:brotli"]
tls = ["dep:rustls", "dep:ring"]
node-argon2 = ["dep:rust-argon2"]
node-crypto = [
	"dep:aes",
	"dep:ctr",
	"dep:ghash",
	"dep:chacha20",
	"dep:poly1305",
	"dep:ring",
	"dep:rsa",
	"dep:pkcs8",
	"dep:zeroize",
]

# The always-on Intl floor: locale parsing/negotiation (Intl.Locale,
# getCanonicalLocales, maximize/minimize) + result stringification. Every service
# feature enables it. ~0.2 MB.
intl = ["dep:icu_locale", "icu_locale/compiled_data", "dep:writeable"]

# One feature per ECMA-402 service. Each pulls its icu sub-crate(s) + compiled_data;
# cargo resolves the transitive DATA crates (e.g. icu_collator/compiled_data pulls
# icu_normalizer + icu_properties). Cross-service edges seen in lib.rs are explicit:
# DateTimeFormat constructs icu_calendar/icu_time inputs and renders via decimal;
# RelativeTime/Duration use decimal (+ plurals).
intl-collator = ["intl", "dep:icu_collator", "icu_collator/compiled_data"]
intl-number-format = [
	"intl",
	"dep:icu_decimal",
	"icu_decimal/compiled_data",
	"dep:icu_provider",
	"dep:fixed_decimal",
	"dep:icu_plurals",
	"icu_plurals/compiled_data",
]
intl-date-time-format = [
	"intl",
	"intl-number-format",
	"dep:icu_datetime",
	"icu_datetime/compiled_data",
	"dep:icu_calendar",
	"icu_calendar/compiled_data",
	"dep:icu_time",
	"icu_time/compiled_data",
]
intl-plural-rules = ["intl", "dep:icu_plurals", "icu_plurals/compiled_data"]
intl-list-format = ["intl", "dep:icu_list", "icu_list/compiled_data"]
intl-segmenter = ["intl", "dep:icu_segmenter", "icu_segmenter/compiled_data"]
intl-display-names = ["intl", "dep:icu_experimental", "icu_experimental/compiled_data"]
intl-relative-time-format = [
	"intl",
	"dep:icu_decimal",
	"icu_decimal/compiled_data",
	"dep:icu_plurals",
	"icu_plurals/compiled_data",
	"dep:icu_provider",
	"dep:icu_experimental",
	"icu_experimental/compiled_data",
]
intl-duration-format = [
	"intl",
	"dep:temporal_rs",
	"dep:fixed_decimal",
	"dep:icu_decimal",
	"icu_decimal/compiled_data",
	"dep:icu_plurals",
	"icu_plurals/compiled_data",
	"dep:icu_list",
	"icu_list/compiled_data",
	"dep:icu_provider",
	"dep:icu_experimental",
	"icu_experimental/compiled_data",
]

# Every service.
intl-full = [
	"intl-collator",
	"intl-number-format",
	"intl-date-time-format",
	"intl-plural-rules",
	"intl-list-format",
	"intl-segmenter",
	"intl-display-names",
	"intl-relative-time-format",
	"intl-duration-format",
]

# One fat-LTO codegen unit is also what makes the all-features archive cheap:
# linker section GC removes unreferenced functions and data from it at symbol
# granularity, so each binary keeps the same Rust code a per-configuration
# build would. ThinLTO over many codegen units links measurably larger binaries.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
