<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<meta
			name="description"
			content="Explore how Maligator lowers common JavaScript constructs through Core, Target, MALW, and native C."
		/>
		<title>Compiler output explorer — Maligator</title>
		<style>
			:root {
				color-scheme: light dark;
				--paper: #fff6df;
				--paper-deep: #f4e6c5;
				--ink: #0b2c35;
				--muted: #52666a;
				--tan: #d99543;
				--tan-soft: #efc37f;
				--cyan: #00b8d7;
				--cyan-deep: #007e99;
				--coral: #dd6746;
				--line: color-mix(in srgb, var(--ink) 17%, transparent);
				--line-strong: color-mix(in srgb, var(--ink) 34%, transparent);
				--panel: color-mix(in srgb, var(--paper) 82%, white);
				--paper-strong: color-mix(in srgb, var(--panel) 88%, white);
				--tan-wash: color-mix(in srgb, var(--tan) 28%, var(--panel));
				--coral-wash: color-mix(in srgb, var(--coral) 28%, var(--panel));
				--cyan-wash: color-mix(in srgb, var(--cyan) 18%, var(--panel));
				--shadow: 0 24px 70px color-mix(in srgb, var(--ink) 13%, transparent);
				--radius: 1.4rem;
				--mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
				--sans:
					Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
					sans-serif;
			}

			@media (prefers-color-scheme: dark) {
				:root {
					--paper: #091e26;
					--paper-deep: #102d36;
					--ink: #f7e8c8;
					--muted: #b4c4c4;
					--tan: #efa956;
					--tan-soft: #9a6637;
					--cyan: #38cbe4;
					--cyan-deep: #78dff0;
					--coral: #f07b5b;
					--line: color-mix(in srgb, var(--ink) 20%, transparent);
					--line-strong: color-mix(in srgb, var(--ink) 38%, transparent);
					--panel: color-mix(in srgb, var(--paper) 84%, black);
					--paper-strong: color-mix(in srgb, var(--panel) 88%, var(--paper-deep));
					--shadow: 0 24px 70px color-mix(in srgb, black 32%, transparent);
				}
			}

			* {
				box-sizing: border-box;
			}

			html {
				background: var(--paper);
			}

			body {
				margin: 0;
				min-width: 320px;
				background:
					radial-gradient(
						circle at 10% 0%,
						color-mix(in srgb, var(--cyan) 17%, transparent),
						transparent 28rem
					),
					radial-gradient(
						circle at 92% 12%,
						color-mix(in srgb, var(--tan) 20%, transparent),
						transparent 30rem
					),
					var(--paper);
				color: var(--ink);
				font: 16px/1.6 var(--sans);
				overflow: hidden;
				text-rendering: optimizeLegibility;
			}

			button,
			select {
				font: inherit;
			}

			button,
			a,
			select {
				-webkit-tap-highlight-color: transparent;
			}

			button:focus-visible,
			a:focus-visible,
			select:focus-visible,
			.code-scroll:focus-visible {
				outline: 3px solid var(--cyan);
				outline-offset: 4px;
			}

			.skip-link {
				position: fixed;
				z-index: 20;
				top: 0.75rem;
				left: 0.75rem;
				padding: 0.65rem 1rem;
				border-radius: 0.6rem;
				background: var(--ink);
				color: var(--paper);
				transform: translateY(-160%);
			}

			.skip-link:focus {
				transform: translateY(0);
			}

			.app {
				display: grid;
				grid-template-rows: auto auto auto minmax(0, 1fr) auto;
				height: 100dvh;
				min-height: 38rem;
			}

			.catalog,
			.stage-nav,
			.focus-bar {
				padding-inline: clamp(1rem, 3vw, 3rem);
			}

			.wrap {
				width: min(1180px, calc(100% - 2rem));
				margin-inline: auto;
			}

			.site-header {
				display: flex;
				align-items: center;
				justify-content: space-between;
				min-height: 5.25rem;
				border-bottom: 1px solid var(--line);
			}

			.wordmark {
				display: inline-flex;
				gap: 0.7rem;
				align-items: center;
				color: inherit;
				font-size: 1.25rem;
				font-weight: 900;
				letter-spacing: -0.04em;
				text-decoration: none;
			}

			.nav-mascot {
				display: block;
				width: 2.65rem;
				height: 2.65rem;
				aspect-ratio: 1;
				border: 2px solid currentColor;
				border-radius: 50%;
				object-fit: cover;
			}

			.primary-navigation {
				display: flex;
				gap: 1.25rem;
				align-items: center;
				font-size: 0.9rem;
				font-weight: 700;
			}

			.primary-navigation a {
				color: inherit;
				text-decoration-color: color-mix(in srgb, currentColor 45%, transparent);
				text-underline-offset: 0.25rem;
			}

			.primary-navigation a[aria-current="page"] {
				color: var(--cyan-deep);
				text-decoration-thickness: 0.16rem;
			}

			.catalog {
				display: grid;
				grid-template-columns: minmax(13rem, 19rem) minmax(0, 1fr) minmax(11rem, 15rem);
				gap: clamp(1rem, 2.5vw, 2.5rem);
				align-items: center;
				padding-block: 0.85rem;
				border-bottom: 1px solid var(--line);
			}

			.field {
				display: grid;
				gap: 0.32rem;
			}

			.field-label,
			.eyebrow,
			.pane-kind {
				color: var(--cyan-deep);
				font-family: var(--mono);
				font-size: 0.7rem;
				font-weight: 800;
				letter-spacing: 0.095em;
				text-transform: uppercase;
			}

			.snapshot {
				display: block;
				max-width: 44rem;
				margin-top: 0.3rem;
				overflow: hidden;
				color: var(--muted);
				font-family: var(--mono);
				font-size: 0.64rem;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			select {
				width: 100%;
				min-height: 2.55rem;
				padding: 0.58rem 2.2rem 0.58rem 0.72rem;
				border: 1px solid var(--line-strong);
				border-radius: 0.45rem;
				background: var(--paper-strong);
				color: var(--ink);
			}

			.example-copy {
				min-width: 0;
			}

			.example-heading {
				display: flex;
				align-items: baseline;
				gap: 0.6rem;
				margin-bottom: 0.25rem;
			}

			.example-heading h1 {
				margin: 0;
				font-size: clamp(1.15rem, 2.1vw, 1.7rem);
				letter-spacing: -0.04em;
				line-height: 1.05;
			}

			.example-copy p {
				max-width: 60rem;
				margin: 0;
				color: var(--muted);
				font-size: 0.83rem;
				line-height: 1.45;
			}

			.stage-nav {
				display: grid;
				grid-template-columns: 2.7rem minmax(0, 1fr) 2.7rem;
				gap: 0.65rem;
				align-items: center;
				padding-block: 0.65rem;
			}

			.nav-arrow,
			.expand-button,
			.link-button {
				border: 1px solid var(--line);
				background: var(--paper-strong);
				color: var(--cyan-deep);
				cursor: pointer;
			}

			.nav-arrow {
				display: grid;
				place-items: center;
				width: 2.7rem;
				height: 2.7rem;
				border-radius: 50%;
				font-size: 1.25rem;
			}

			.nav-arrow:disabled {
				cursor: default;
				opacity: 0.28;
			}

			.step-list {
				display: grid;
				grid-template-columns: repeat(5, minmax(0, 1fr));
				margin: 0;
				padding: 0;
				list-style: none;
			}

			.step-list li {
				position: relative;
			}

			.step-list li::before {
				position: absolute;
				top: 0.56rem;
				right: 50%;
				left: -50%;
				height: 1px;
				background: var(--line);
				content: "";
			}

			.step-list li:first-child::before {
				display: none;
			}

			.step-button {
				position: relative;
				z-index: 1;
				display: grid;
				justify-items: center;
				gap: 0.28rem;
				width: 100%;
				padding: 0;
				border: 0;
				background: transparent;
				color: var(--muted);
				cursor: pointer;
				font-size: 0.68rem;
				font-weight: 680;
			}

			.step-dot {
				display: grid;
				place-items: center;
				width: 1.15rem;
				height: 1.15rem;
				border: 1px solid var(--line-strong);
				border-radius: 50%;
				background: var(--paper);
				color: transparent;
				transition: 160ms ease;
			}

			.step-button.is-past .step-dot {
				border-color: var(--tan);
				background: var(--tan-wash);
				color: var(--ink);
			}

			.step-button.is-active {
				color: var(--ink);
			}

			.step-button.is-active .step-dot {
				border-color: var(--cyan);
				background: var(--cyan);
				box-shadow: 0 0 0 4px color-mix(in srgb, var(--cyan) 22%, transparent);
				transform: scale(1.08);
			}

			.stage-viewport {
				min-height: 0;
				overflow: hidden;
			}

			.stage-strip {
				display: flex;
				height: 100%;
				overflow-x: auto;
				overflow-y: hidden;
				scroll-behavior: smooth;
				scroll-snap-type: x mandatory;
				scrollbar-width: none;
				overscroll-behavior-x: contain;
			}

			.stage-strip::-webkit-scrollbar {
				display: none;
			}

			.scene {
				flex: 0 0 100%;
				min-width: 0;
				height: 100%;
				padding: 0 clamp(1rem, 3vw, 3rem) 0.8rem;
				scroll-snap-align: start;
				scroll-snap-stop: always;
			}

			.scene-grid {
				display: grid;
				grid-template-columns: minmax(0, 1fr) 3.4rem minmax(0, 1fr);
				height: 100%;
				min-height: 0;
			}

			.output-pane {
				display: grid;
				grid-template-rows: auto minmax(0, 1fr);
				min-width: 0;
				min-height: 0;
				overflow: hidden;
				border: 1px solid var(--line);
				border-radius: var(--radius);
				background: var(--panel);
				box-shadow: var(--shadow);
			}

			.pane-header {
				display: grid;
				grid-template-columns: minmax(0, 1fr) auto;
				gap: 1rem;
				align-items: center;
				min-height: 4.25rem;
				padding: 0.7rem 0.85rem;
				border-bottom: 1px solid var(--line);
				background: var(--paper-strong);
			}

			.pane-title {
				margin: 0.14rem 0 0;
				font-size: 0.97rem;
				letter-spacing: -0.02em;
			}

			.pane-description {
				margin: 0.15rem 0 0;
				color: var(--muted);
				font-size: 0.7rem;
				line-height: 1.25;
			}

			.expand-button {
				min-height: 2rem;
				padding: 0.38rem 0.58rem;
				border-radius: 999px;
				font-size: 0.68rem;
				font-weight: 720;
				white-space: nowrap;
			}

			.expand-button[aria-pressed="true"] {
				border-color: var(--ink);
				background: var(--ink);
				color: var(--paper);
			}

			.code-scroll {
				min-height: 0;
				overflow: auto;
				background:
					linear-gradient(
							90deg,
							color-mix(in srgb, var(--ink) 4%, transparent) 1px,
							transparent 1px
						)
						0 0 / 3rem 100%,
					var(--panel);
				overscroll-behavior: contain;
				scrollbar-color: var(--line-strong) transparent;
			}

			.code-table {
				width: max-content;
				min-width: 100%;
				padding: 0.65rem 0 2rem;
				font-family: var(--mono);
				font-size: clamp(0.68rem, 0.83vw, 0.79rem);
				line-height: 1.62;
				font-variant-ligatures: none;
			}

			.code-line {
				display: grid;
				grid-template-columns: 3.2rem auto;
				min-height: 1.62em;
				padding-right: 1rem;
				white-space: pre;
			}

			.line-number {
				padding-right: 0.75rem;
				color: var(--muted);
				text-align: right;
				user-select: none;
			}

			.line-content {
				min-width: max-content;
			}

			.omission {
				color: var(--line-strong);
				font-style: italic;
			}

			.trace-token {
				display: inline;
				margin: 0;
				padding: 0 0.08rem;
				border: 0;
				border-radius: 0.16rem;
				background: var(--tan-wash);
				color: inherit;
				cursor: pointer;
				font: inherit;
				line-height: inherit;
				text-align: left;
			}

			.trace-token:hover {
				box-shadow: inset 0 -2px var(--tan);
			}

			.trace-token.is-active {
				background: var(--coral-wash);
				box-shadow: inset 0 -2px var(--coral);
			}

			.bridge {
				display: grid;
				place-items: center;
				position: relative;
			}

			.bridge::before {
				position: absolute;
				right: 0;
				left: 0;
				top: 50%;
				height: 1px;
				background: var(--line-strong);
				content: "";
			}

			.link-button {
				position: relative;
				z-index: 1;
				display: grid;
				place-items: center;
				width: 2.4rem;
				height: 2.4rem;
				border-radius: 50%;
				font-size: 1rem;
			}

			.link-button[aria-pressed="true"] {
				border-color: var(--ink);
				background: var(--ink);
				color: var(--paper);
			}

			.focus-bar {
				display: grid;
				grid-template-columns: auto minmax(0, 1fr) auto;
				gap: 0.8rem;
				align-items: center;
				min-height: 3.65rem;
				border-top: 1px solid var(--line);
				background: var(--ink);
				color: var(--paper);
			}

			.focus-name {
				display: inline-flex;
				align-items: center;
				gap: 0.45rem;
				font-size: 0.78rem;
				font-weight: 760;
				white-space: nowrap;
			}

			.focus-name::before {
				width: 0.62rem;
				height: 0.62rem;
				border-radius: 50%;
				background: var(--coral);
				box-shadow: 0 0 0 3px color-mix(in srgb, var(--coral) 24%, transparent);
				content: "";
			}

			.focus-explanation {
				margin: 0;
				color: color-mix(in srgb, var(--paper) 84%, var(--ink));
				font-size: 0.76rem;
				line-height: 1.35;
			}

			.focus-hint {
				color: color-mix(in srgb, var(--paper) 65%, var(--ink));
				font-size: 0.66rem;
				white-space: nowrap;
			}

			@media (max-width: 820px) {
				.primary-navigation {
					display: none;
				}
			}

			@media (max-width: 900px) {
				.catalog {
					grid-template-columns: minmax(12rem, 17rem) minmax(0, 1fr);
				}

				.focus-field {
					grid-column: 1 / -1;
					display: none;
				}
			}

			@media (max-width: 700px) {
				.app {
					min-height: 32rem;
				}

				.catalog,
				.stage-nav,
				.focus-bar {
					padding-inline: 0.75rem;
				}

				.snapshot {
					display: none;
				}

				.catalog {
					grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
					gap: 0.65rem;
					padding-block: 0.55rem;
				}

				.field-label {
					display: none;
				}

				select {
					min-height: 2.35rem;
					font-size: 0.78rem;
				}

				.example-heading {
					display: block;
					margin: 0;
				}

				.example-heading h1 {
					font-size: 1rem;
				}

				.example-heading .eyebrow,
				.example-copy p {
					display: none;
				}

				.stage-nav {
					grid-template-columns: 2.55rem minmax(0, 1fr) 2.55rem;
					gap: 0.35rem;
					padding-block: 0.45rem;
				}

				.nav-arrow {
					width: 2.55rem;
					height: 2.55rem;
				}

				.step-label {
					display: none;
				}

				.step-list li::before {
					top: 0.57rem;
				}

				.step-button {
					min-height: 2.55rem;
				}

				.scene {
					padding: 0 0.75rem 0.55rem;
				}

				.scene-grid {
					grid-template-columns: minmax(0, 1fr);
					grid-template-rows: minmax(0, 1fr) 2.2rem minmax(0, 1fr);
				}

				.bridge::before {
					top: 0;
					bottom: 0;
					left: 50%;
					width: 1px;
					height: auto;
				}

				.link-button {
					width: 2rem;
					height: 2rem;
					font-size: 0.9rem;
					transform: rotate(90deg);
				}

				.output-pane {
					border-radius: 1rem;
				}

				.pane-header {
					min-height: 3.1rem;
					padding: 0.45rem 0.6rem;
				}

				.pane-title {
					font-size: 0.82rem;
				}

				.pane-kind,
				.pane-description {
					display: none;
				}

				.expand-button {
					min-height: 1.8rem;
					font-size: 0.62rem;
				}

				.code-table {
					font-size: 0.66rem;
					line-height: 1.48;
				}

				.code-line {
					grid-template-columns: 2.7rem auto;
				}

				.focus-bar {
					grid-template-columns: auto minmax(0, 1fr);
					gap: 0.6rem;
					min-height: 3.4rem;
					padding-block: 0.45rem;
				}

				.focus-name {
					font-size: 0.68rem;
				}

				.focus-explanation {
					display: -webkit-box;
					overflow: hidden;
					font-size: 0.67rem;
					-webkit-box-orient: vertical;
					-webkit-line-clamp: 2;
				}

				.focus-hint {
					display: none;
				}
			}

			@media (max-width: 520px) {
				.wrap {
					width: min(1180px, calc(100% - 1.25rem));
				}

				.site-header {
					min-height: 4.5rem;
				}
			}

			@media (max-width: 700px) and (orientation: landscape) {
				.example-copy,
				.focus-bar {
					display: none;
				}

				.catalog {
					grid-template-columns: minmax(0, 19rem);
				}

				.scene-grid {
					grid-template-columns: minmax(0, 1fr) 3rem minmax(0, 1fr);
					grid-template-rows: minmax(0, 1fr);
				}

				.bridge::before {
					top: 50%;
					right: 0;
					bottom: auto;
					left: 0;
					width: auto;
					height: 1px;
				}

				.link-button {
					transform: none;
				}
			}

			@media (prefers-reduced-motion: reduce) {
				*,
				*::before,
				*::after {
					scroll-behavior: auto !important;
					transition-duration: 0.01ms !important;
				}
			}
		</style>
	</head>
	<body>
		<a class="skip-link" href="#stage-strip">Skip to pipeline</a>
		<div class="app">
			<div class="site-nav-shell">
				<header class="site-header wrap">
					<a class="wordmark" href="/" aria-label="Maligator home">
						<img
							class="nav-mascot"
							src="data:image/webp;base64,__MALIGATOR_NAV_MASCOT__"
							alt=""
							width="768"
							height="768"
						/>
						maligator
					</a>
					<nav class="primary-navigation" aria-label="Primary navigation">
						<a href="/#progress">Progress</a>
						<a href="/explorer" aria-current="page">Explorer</a>
						<a href="/compatibility">Compatibility</a>
						<a href="/#reality">Reality</a>
						<a href="/#example">Built with itself</a>
						<a href="https://github.com/dirkdev98/maligator">GitHub</a>
					</nav>
				</header>
			</div>

			<section class="catalog" aria-labelledby="example-title">
				<label class="field" for="example-select">
					<span class="field-label">Example catalogue</span>
					<select id="example-select"></select>
				</label>
				<div class="example-copy">
					<div class="example-heading">
						<span class="eyebrow" id="example-group"></span>
						<h1 id="example-title"></h1>
					</div>
					<p id="example-summary"></p>
					<span class="snapshot" id="snapshot"></span>
				</div>
				<label class="field focus-field" for="focus-select">
					<span class="field-label">Follow through the pipeline</span>
					<select id="focus-select"></select>
				</label>
			</section>

			<nav class="stage-nav" aria-label="Pipeline stages">
				<button
					class="nav-arrow"
					id="previous-step"
					type="button"
					aria-label="Previous comparison"
				>
					←
				</button>
				<ol class="step-list" id="step-list"></ol>
				<button
					class="nav-arrow"
					id="next-step"
					type="button"
					aria-label="Next comparison"
				>
					→
				</button>
			</nav>

			<main class="stage-viewport">
				<div class="stage-strip" id="stage-strip" tabindex="-1"></div>
			</main>

			<footer class="focus-bar" aria-live="polite">
				<span class="focus-name" id="focus-name"></span>
				<p class="focus-explanation" id="focus-explanation"></p>
				<span class="focus-hint">Select a highlighted construct to follow it</span>
			</footer>
		</div>

		<script id="explorer-data" type="application/json">
			__MALIGATOR_OUTPUT_EXPLORER_DATA__
		</script>
		<script>
			const DATA = JSON.parse(document.querySelector("#explorer-data").textContent);
			const STEPS = [
				{
					id: "lowering",
					label: "Lowering",
					left: {
						view: "source",
						kind: "Input",
						label: "JavaScript",
						description: "The source construct",
					},
					right: {
						view: "preCore",
						kind: "Core",
						label: "Initial Core",
						description: "SSA before optimization",
					},
				},
				{
					id: "optimization",
					label: "Optimization",
					left: {
						view: "optimizedCore",
						mode: "ablated",
						kind: "Core",
						label: "Baseline Core",
						description: "Canonical Core lowered without late specialization",
					},
					right: {
						view: "optimizedCore",
						mode: "full",
						kind: "Core",
						label: "Optimized Core",
						description: "Production optimization",
					},
				},
				{
					id: "allocation",
					label: "Allocation",
					left: {
						view: "optimizedCore",
						mode: "full",
						kind: "Core",
						label: "Optimized Core",
						description: "The proven SSA graph",
					},
					right: {
						view: "target",
						mode: "full",
						kind: "Target",
						label: "Allocated Target",
						description: "Backend-neutral terminal operations",
					},
				},
				{
					id: "malw",
					label: "Portable",
					left: {
						view: "target",
						mode: "full",
						kind: "Target",
						label: "Allocated Target",
						description: "Shared terminal input",
					},
					right: {
						view: "malw",
						mode: "full",
						kind: "MALW",
						label: "Portable image",
						description: "Decoded runtime image written to the wire format",
					},
				},
				{
					id: "native",
					label: "Native",
					left: {
						view: "target",
						mode: "full",
						kind: "Target",
						label: "Allocated Target",
						description: "Shared terminal input",
					},
					right: {
						view: "c",
						mode: "full",
						kind: "Native",
						label: "Generated C",
						description: "Compiled terminal and runtime image tables",
					},
				},
			];

			const elements = {
				exampleSelect: document.querySelector("#example-select"),
				focusSelect: document.querySelector("#focus-select"),
				exampleGroup: document.querySelector("#example-group"),
				exampleTitle: document.querySelector("#example-title"),
				exampleSummary: document.querySelector("#example-summary"),
				stepList: document.querySelector("#step-list"),
				strip: document.querySelector("#stage-strip"),
				previous: document.querySelector("#previous-step"),
				next: document.querySelector("#next-step"),
				focusName: document.querySelector("#focus-name"),
				focusExplanation: document.querySelector("#focus-explanation"),
				snapshot: document.querySelector("#snapshot"),
			};

			const expandedPanes = new Set();
			let scrollGuard = false;
			let stripScrollTimer;
			const hashState = new URLSearchParams(location.hash.slice(1));
			const requestedSample = DATA.samples.findIndex(
				(item) => item.id === hashState.get("sample"),
			);
			const state = {
				sample: requestedSample < 0 ? 0 : requestedSample,
				step: clamp(Number(hashState.get("step") ?? 0), 0, STEPS.length - 1),
				trace: Math.max(0, Number(hashState.get("trace") ?? 0) || 0),
				linked: hashState.get("linked") !== "false",
			};

			function clamp(value, minimum, maximum) {
				if (!Number.isFinite(value)) return minimum;
				return Math.min(maximum, Math.max(minimum, Math.round(value)));
			}

			function escapeHtml(value) {
				return value
					.replaceAll("&", "&amp;")
					.replaceAll("<", "&lt;")
					.replaceAll(">", "&gt;")
					.replaceAll('"', "&quot;");
			}

			function sample() {
				return DATA.samples[state.sample];
			}

			function trace() {
				return sample().trails[state.trace] ?? sample().trails[0];
			}

			function viewText(specification) {
				const current = sample();
				if (specification.view === "source") return current.source;
				if (specification.view === "preCore") return current.preCore;
				return current.modes[specification.mode ?? "full"][specification.view];
			}

			function paneKey(step, side) {
				return `${sample().id}:${step.id}:${side}`;
			}

			function visibleLines(text, query, expanded) {
				const lines = text.split("\n");
				if (expanded || lines.length <= 26)
					return lines.map((content, index) => ({ content, number: index + 1 }));
				const match = query
					? lines.findIndex((line) => line.toLowerCase().includes(query.toLowerCase()))
					: -1;
				const center = match < 0 ? 0 : match;
				const start = Math.max(0, center - 8);
				const end = Math.min(lines.length, center + 11);
				const visible = [];
				if (start > 0) visible.push({ omission: `${start} lines above` });
				for (let index = start; index < end; index++)
					visible.push({ content: lines[index], number: index + 1 });
				if (end < lines.length)
					visible.push({ omission: `${lines.length - end} lines below` });
				return visible;
			}

			function decoratedLine(content, view) {
				const matches = [];
				for (const [traceIndex, candidate] of sample().trails.entries()) {
					const query = candidate.queries[view];
					if (!query) continue;
					const lowerContent = content.toLowerCase();
					const lowerQuery = query.toLowerCase();
					let offset = 0;
					while (offset < content.length) {
						const start = lowerContent.indexOf(lowerQuery, offset);
						if (start < 0) break;
						matches.push({ start, end: start + query.length, traceIndex });
						offset = start + Math.max(1, query.length);
					}
				}
				matches.sort((left, right) => left.start - right.start || right.end - left.end);
				const accepted = [];
				let coveredUntil = -1;
				for (const match of matches) {
					if (match.start < coveredUntil) continue;
					accepted.push(match);
					coveredUntil = match.end;
				}
				if (accepted.length === 0) return escapeHtml(content);
				let html = "";
				let offset = 0;
				for (const match of accepted) {
					html += escapeHtml(content.slice(offset, match.start));
					const active = match.traceIndex === state.trace ? " is-active" : "";
					const title = escapeHtml(sample().trails[match.traceIndex].title);
					html += `<button class="trace-token${active}" type="button" data-trace="${match.traceIndex}" aria-label="Follow ${title}" title="Follow ${title}">${escapeHtml(content.slice(match.start, match.end))}</button>`;
					offset = match.end;
				}
				return html + escapeHtml(content.slice(offset));
			}

			function renderCode(specification, expanded) {
				const selectedQuery = trace().queries[specification.view];
				return visibleLines(viewText(specification), selectedQuery, expanded)
					.map((line) => {
						if (line.omission)
							return `<div class="code-line omission"><span class="line-number">⋯</span><span class="line-content">${escapeHtml(line.omission)}</span></div>`;
						return `<div class="code-line"><span class="line-number">${line.number}</span><span class="line-content">${decoratedLine(line.content, specification.view)}</span></div>`;
					})
					.join("");
			}

			function renderPane(step, side, specification) {
				const key = paneKey(step, side);
				const expanded = expandedPanes.has(key);
				const canExpand = viewText(specification).split("\n").length > 26;
				return `<section class="output-pane" data-side="${side}" aria-label="${escapeHtml(specification.label)}">
					<header class="pane-header"><div><div class="pane-kind">${escapeHtml(specification.kind)}</div><h2 class="pane-title">${escapeHtml(specification.label)}</h2><p class="pane-description">${escapeHtml(specification.description)}</p></div>${canExpand ? `<button class="expand-button" type="button" data-expand="${escapeHtml(key)}" aria-pressed="${expanded}">${expanded ? "Show focus" : "Full output"}</button>` : ""}</header>
					<div class="code-scroll" tabindex="0"><div class="code-table">${renderCode(specification, expanded)}</div></div>
				</section>`;
			}

			function renderScene(step, index) {
				const linkLabel = state.linked ? "Unlink pane scrolling" : "Link pane scrolling";
				return `<article class="scene" data-step="${index}" aria-label="${escapeHtml(step.label)} comparison"><div class="scene-grid">${renderPane(step, "left", step.left)}<div class="bridge"><button class="link-button" type="button" data-link aria-label="${linkLabel}" title="${linkLabel}" aria-pressed="${state.linked}">${state.linked ? "⇄" : "→"}</button></div>${renderPane(step, "right", step.right)}</div></article>`;
			}

			function renderExampleOptions() {
				const groups = new Map();
				for (const [index, candidate] of DATA.samples.entries()) {
					if (!groups.has(candidate.group)) groups.set(candidate.group, []);
					groups.get(candidate.group).push({ candidate, index });
				}
				elements.exampleSelect.innerHTML = [...groups.entries()]
					.map(
						([group, entries]) =>
							`<optgroup label="${escapeHtml(group)}">${entries.map(({ candidate, index }) => `<option value="${index}">${escapeHtml(candidate.title)}</option>`).join("")}</optgroup>`,
					)
					.join("");
			}

			function renderFocusOptions() {
				elements.focusSelect.innerHTML = sample()
					.trails.map(
						(candidate, index) =>
							`<option value="${index}">${escapeHtml(candidate.title)}</option>`,
					)
					.join("");
				elements.focusSelect.disabled = sample().trails.length === 1;
				elements.focusSelect.value = String(state.trace);
			}

			function renderStepNavigation() {
				elements.stepList.innerHTML = STEPS.map((step, index) => {
					const status =
						index === state.step ? " is-active" : index < state.step ? " is-past" : "";
					return `<li><button class="step-button${status}" type="button" data-go-step="${index}" aria-current="${index === state.step ? "step" : "false"}"><span class="step-dot">${index < state.step ? "✓" : "•"}</span><span class="step-label">${escapeHtml(step.label)}</span></button></li>`;
				}).join("");
				elements.previous.disabled = state.step === 0;
				elements.next.disabled = state.step === STEPS.length - 1;
			}

			function updateHash() {
				const next = new URLSearchParams({
					sample: sample().id,
					step: String(state.step),
					trace: String(state.trace),
				});
				if (!state.linked) next.set("linked", "false");
				history.replaceState(null, "", `#${next}`);
			}

			function alignFocus() {
				const scene = elements.strip.querySelector(`[data-step="${state.step}"]`);
				if (!scene) return;
				for (const pane of scene.querySelectorAll(".code-scroll")) {
					const selected = pane.querySelector(".trace-token.is-active");
					if (selected) selected.scrollIntoView({ block: "center", inline: "center" });
					else pane.scrollTo({ top: 0, left: 0 });
				}
			}

			function scrollToStep(behavior = "smooth") {
				elements.strip.scrollTo({
					left: state.step * elements.strip.clientWidth,
					behavior,
				});
			}

			function bindLinkedScrolling() {
				for (const scene of elements.strip.querySelectorAll(".scene")) {
					const panes = [...scene.querySelectorAll(".code-scroll")];
					for (const [index, pane] of panes.entries()) {
						pane.addEventListener("scroll", () => {
							if (!state.linked || scrollGuard) return;
							const other = panes[index === 0 ? 1 : 0];
							const available = pane.scrollHeight - pane.clientHeight;
							const otherAvailable = other.scrollHeight - other.clientHeight;
							if (available <= 0 || otherAvailable <= 0) return;
							scrollGuard = true;
							other.scrollTop = (pane.scrollTop / available) * otherAvailable;
							requestAnimationFrame(() => {
								scrollGuard = false;
							});
						});
					}
				}
			}

			function render(options = {}) {
				state.trace = clamp(state.trace, 0, sample().trails.length - 1);
				elements.exampleSelect.value = String(state.sample);
				elements.exampleGroup.textContent = sample().group;
				elements.exampleTitle.textContent = sample().title;
				elements.exampleSummary.textContent = sample().summary;
				elements.focusName.textContent = trace().title;
				elements.focusExplanation.textContent = trace().explanation;
				renderFocusOptions();
				renderStepNavigation();
				elements.strip.innerHTML = STEPS.map(renderScene).join("");
				bindLinkedScrolling();
				updateHash();
				requestAnimationFrame(() => {
					scrollToStep("instant");
					if (options.align !== false) requestAnimationFrame(alignFocus);
				});
			}

			function setStep(index) {
				const next = clamp(index, 0, STEPS.length - 1);
				if (next === state.step) return;
				state.step = next;
				renderStepNavigation();
				updateHash();
				scrollToStep();
				requestAnimationFrame(alignFocus);
			}

			renderExampleOptions();
			const snapshot = DATA.manifest.snapshot;
			elements.snapshot.textContent = `v${snapshot.maligatorVersion} · ${snapshot.commit}${snapshot.dirty ? " + working tree" : ""}`;
			render();

			elements.exampleSelect.addEventListener("change", (event) => {
				state.sample = Number(event.target.value);
				state.trace = 0;
				render();
			});

			elements.focusSelect.addEventListener("change", (event) => {
				state.trace = Number(event.target.value);
				render();
			});

			elements.previous.addEventListener("click", () => setStep(state.step - 1));
			elements.next.addEventListener("click", () => setStep(state.step + 1));
			elements.stepList.addEventListener("click", (event) => {
				const button = event.target.closest("[data-go-step]");
				if (button) setStep(Number(button.dataset.goStep));
			});

			elements.strip.addEventListener("click", (event) => {
				const traceButton = event.target.closest("[data-trace]");
				if (traceButton) {
					state.trace = Number(traceButton.dataset.trace);
					render();
					return;
				}
				const expandButton = event.target.closest("[data-expand]");
				if (expandButton) {
					const key = expandButton.dataset.expand;
					if (expandedPanes.has(key)) expandedPanes.delete(key);
					else expandedPanes.add(key);
					render();
					return;
				}
				const linkButton = event.target.closest("[data-link]");
				if (linkButton) {
					state.linked = !state.linked;
					render({ align: false });
				}
			});

			elements.strip.addEventListener("scroll", () => {
				clearTimeout(stripScrollTimer);
				stripScrollTimer = setTimeout(() => {
					const index = clamp(
						elements.strip.scrollLeft / Math.max(1, elements.strip.clientWidth),
						0,
						STEPS.length - 1,
					);
					if (index !== state.step) {
						state.step = index;
						renderStepNavigation();
						updateHash();
						requestAnimationFrame(alignFocus);
					}
				}, 90);
			});

			window.addEventListener("resize", () => scrollToStep("instant"));
			window.addEventListener("keydown", (event) => {
				if (!event.altKey || event.defaultPrevented) return;
				if (event.key === "ArrowLeft") setStep(state.step - 1);
				if (event.key === "ArrowRight") setStep(state.step + 1);
			});
		</script>
	</body>
</html>
